configTitle: Global Dialogues GD3 - Other religious group (42 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for Other religious group. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 47cdf76a-9abf-4b5c-abbe-2d5b00ef172d-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Thinking about the last three months, how often, if at all, have you personally
      chosen to use an AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 20):

      - Religion: Other religious group


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "More excited than concerned" (50%), with "Equally concerned and excited" as a secondary
      choice (45%). Compared to the overall population: 16% more likely to choose "More excited than concerned"; 10%
      less likely to choose "Equally concerned and excited"; 6% less likely to choose "More concerned than excited"

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (80%). Compared to the overall population: 12% more likely to choose "daily";
      11% less likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": A clear majority favors "weekly" (60%), with "daily" as a secondary choice
      (15%). Compared to the overall population: 16% less likely to choose "daily"; 16% more likely to choose "weekly";
      12% less likely to choose "monthly"; 10% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": A clear majority favors "daily" (50%), with "weekly" as a secondary choice (25%). Compared to the overall
      population: 5% less likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": Tends toward "daily" (40%) with substantial minority disagreement. Compared to the overall population: 10%
      less likely to choose "daily"; 5% more likely to choose "monthly"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": Tends toward "never" (45%) with substantial minority
      disagreement. Compared to the overall population: 7% less likely to choose "weekly"; 13% more likely to choose
      "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": A clear majority favors "never" (50%), with
      "monthly" as a secondary choice (20%). Compared to the overall population: 5% more likely to choose "daily"; 5%
      more likely to choose "monthly"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": Tends toward "Risks and benefits are equal" (40%) with substantial minority disagreement. Compared to the
      overall population: 12% more likely to choose "Risks and benefits are equal"; 6% more likely to choose "Benefits
      slightly outweigh risks"; 15% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": Deeply divided between "Risks slightly outweigh benefits" (35%) and "Risks and benefits are equal" (35%).
      Compared to the overall population: 6% less likely to choose "Risks far outweigh benefits"; 14% more likely to
      choose "Risks slightly outweigh benefits"; 6% more likely to choose "Risks and benefits are equal"; 7% less likely
      to choose "Benefits slightly outweigh risks"; 7% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": No dominant position — "Risks and benefits are equal" leads at 35% with opinion spread across options.
      Compared to the overall population: 9% more likely to choose "Risks far outweigh benefits"; 10% more likely to
      choose "Risks and benefits are equal"; 17% less likely to choose "Benefits slightly outweigh risks"; 7% less
      likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Tends toward "Risks and benefits are equal"
      (40%) with substantial minority disagreement. Compared to the overall population: 12% more likely to choose "Risks
      far outweigh benefits"; 19% less likely to choose "Risks slightly outweigh benefits"; 14% more likely to choose
      "Risks and benefits are equal"; 6% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?": No dominant position — "Risks slightly outweigh
      benefits" leads at 35% with opinion spread across options. Compared to the overall population: 9% more likely to
      choose "Risks slightly outweigh benefits"; 7% less likely to choose "Benefits slightly outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": Deeply divided between
      "Strongly Distrust" (25%) and "Somewhat Distrust" (25%). Compared to the overall population: 6% less likely to
      choose "Somewhat Distrust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": Deeply divided
      between "Neither Trust Nor Distrust" (35%) and "Somewhat Trust" (35%). Compared to the overall population: 9% more
      likely to choose "Neither Trust Nor Distrust"; 9% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": Deeply divided
      between "Somewhat Distrust" (35%) and "Neither Trust Nor Distrust" (30%). Compared to the overall population: 8%
      more likely to choose "Somewhat Distrust"; 8% more likely to choose "Neither Trust Nor Distrust"; 14% less likely
      to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": Deeply divided
      between "Strongly Distrust" (35%) and "Somewhat Distrust" (35%). Compared to the overall population: 9% less
      likely to choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": Tends toward
      "Somewhat Distrust" (40%) with substantial minority disagreement. Compared to the overall population: 16% more
      likely to choose "Somewhat Distrust"; 10% less likely to choose "Neither Trust Nor Distrust"; 7% less likely to
      choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": Deeply
      divided between "Somewhat Distrust" (35%) and "Neither Trust Nor Distrust" (35%). Compared to the overall
      population: 6% less likely to choose "Strongly Distrust"; 15% more likely to choose "Somewhat Distrust"; 5% more
      likely to choose "Neither Trust Nor Distrust"; 13% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": No
      dominant position — "Somewhat Trust" leads at 35% with opinion spread across options. Compared to the overall
      population: 6% more likely to choose "Somewhat Distrust"; 12% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": A clear majority
      favors "Somewhat Trust" (50%), with "Strongly Trust" as a secondary choice (25%). Compared to the overall
      population: 10% more likely to choose "Neither Trust Nor Distrust"; 9% more likely to choose "Somewhat Trust"; 18%
      less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": A clear majority favors "Somewhat Distrust" (50%), with "Neither Trust Nor Distrust" as a secondary
      choice (30%). Compared to the overall population: 13% less likely to choose "Strongly Distrust"; 17% more likely
      to choose "Somewhat Distrust"; 6% more likely to choose "Neither Trust Nor Distrust"; 7% less likely to choose
      "Somewhat Trust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": Deeply
      divided between "Somewhat Trust" (30%) and "Somewhat Distrust" (25%). Compared to the overall population: 5% more
      likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": Deeply
      divided between "Neither Trust Nor Distrust" (35%) and "Somewhat Trust" (35%). Compared to the overall population:
      7% less likely to choose "Strongly Distrust"; 7% less likely to choose "Somewhat Distrust"; 8% more likely to
      choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      Deeply divided between "Somewhat Trust" (35%) and "Somewhat Distrust" (30%). Compared to the overall population:
      13% less likely to choose "Strongly Distrust"; 10% more likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": No
      dominant position — "Somewhat Trust" leads at 35% with opinion spread across options. Compared to the overall
      population: 6% more likely to choose "Strongly Distrust"; 8% less likely to choose "Neither Trust Nor Distrust";
      7% less likely to choose "Somewhat Trust"; 9% more likely to choose "Strongly Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": Tends toward "Agree" (45%) with substantial minority disagreement. Compared to the overall
      population: 8% more likely to choose "Agree"; 8% less likely to choose "Unsure"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": Tends toward "Noticeably Better" (40%) with substantial minority
      disagreement. Compared to the overall population: 6% more likely to choose "Noticeably Worse"; 6% less likely to
      choose "Noticeably Better"; 5% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (60%), with "No Major
      Change" as a secondary choice (20%). Compared to the overall population: 7% more likely to choose "Noticeably
      Worse"; 8% more likely to choose "Noticeably Better"; 17% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (55%), with "Noticeably
      Worse" as a secondary choice (20%). Compared to the overall population: 11% less likely to choose "No Major
      Change"; 12% more likely to choose "Noticeably Better"; 7% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": Deeply divided between "Noticeably Worse" (35%) and "Noticeably
      Better" (30%). Compared to the overall population: 7% more likely to choose "Noticeably Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": Deeply divided between "No Major Change" (35%) and "Noticeably Better"
      (30%). Compared to the overall population: 10% more likely to choose "Profoundly Worse"

      On "So far, what has been the overall impact of AI on your daily life?": A clear majority favors "Noticeably
      Better" (65%), with "Profoundly Better" as a secondary choice (15%). Compared to the overall population: 6% more
      likely to choose "Noticeably Worse"; 13% less likely to choose "No Major Change"; 12% more likely to choose
      "Noticeably Better"

      On "Is your job making a meaningful contribution to the world?": Tends toward "Don't Know" (45%) with substantial
      minority disagreement. Compared to the overall population: 31% less likely to choose "Yes"; 28% more likely to
      choose "Don't Know"

      On "Do you think your job is likely to be automated in the next 10 years?": Tends toward "Yes" (40%) with
      substantial minority disagreement. Compared to the overall population: 18% less likely to choose "No"; 17% more
      likely to choose "Don't Know"

      On "Do you think your job should be automated in the next 10 years?": A clear majority favors "No" (55%), with
      "Yes" as a secondary choice (25%). Compared to the overall population: 10% less likely to choose "No"; 7% more
      likely to choose "Don't Know"

      On "So far, how has your community been affected by job loss from automation?": A clear majority favors "Not at
      all" (60%), with "I know several people who have lost their job" as a secondary choice (25%). Compared to the
      overall population: 13% more likely to choose "Not at all"; 10% less likely to choose "I know someone who has lost
      their job"; 5% less likely to choose "I know many people who have lost their job"

      On "Do you agree or disagree?": A clear majority favors "Agree" (70%), with "Disagree" as a secondary choice
      (30%). Compared to the overall population: 24% less likely to choose "Agree"; 24% more likely to choose "Disagree"

      On "Do you agree or disagree?": Near-unanimous agreement on "Agree" (95%)

      On "Do you agree or disagree?": A clear majority favors "Disagree" (70%), with "Agree" as a secondary choice
      (30%). Compared to the overall population: 8% less likely to choose "Agree"; 8% more likely to choose "Disagree"

      On "Do you agree or disagree?": A clear majority favors "Agree" (60%), with "Disagree" as a secondary choice (40%)

      On "Do you feel you were able to fully express your views on your culture, your values, and what you want for the
      future in this conversation? (through what you responded and how you voted)": A clear majority favors "Yes – I was
      able to fully express my views on these topics" (65%), with "Mostly – I was able to mostly express my views on
      these topics, but did not have the chance to express a few things." as a secondary choice (20%). Compared to the
      overall population: 5% less likely to choose "Yes – I was able to fully express my views on these topics"; 10%
      more likely to choose "Somewhat – I was able to somewhat express my views on these topics, but did not have the
      chance to express many things."

      On "Do you feel like you understand yourself better after participating in this conversation?": A clear majority
      favors "Yes" (55%), with "Maybe a little" as a secondary choice (30%). Compared to the overall population: 6% less
      likely to choose "Yes"; 11% more likely to choose "No"


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 40
            - 50
            - 5
            - 0
            - 5
          metric: js-divergence
    idealResponse: '[40.0, 50.0, 5.0, 0.0, 5.0]'
