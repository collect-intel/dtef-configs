configId: dtef-global-dialogues-gd6-country:israel-narrative
configTitle: Global Dialogues GD6 - Israel (90 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for Israel. Source: Global Dialogues GD6
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 2617912e-463a-4fb4-8781-0ada7a788fb2-country:israel
    description: >-
      Predict: Israel → "Considering both potential benefits and risks, how do you assess the overall impact on society
      of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 10):

      - Country: Israel


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": Tends
      toward "Equally concerned and excited" (40%) with substantial minority disagreement. Compared to the overall
      population: 8% less likely to choose "More excited than concerned"; 9% less likely to choose "Equally concerned
      and excited"; 17% more likely to choose "More concerned than excited"

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (80%)

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": A clear majority favors "weekly" (60%), with "daily" as a secondary choice
      (20%). Compared to the overall population: 6% less likely to choose "daily"; 14% more likely to choose "weekly";
      10% less likely to choose "monthly"; 6% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": Tends toward "daily" (40%) with substantial minority disagreement. Compared to the overall population: 8%
      more likely to choose "weekly"; 10% less likely to choose "monthly"; 6% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": A clear majority favors "daily" (60%), with "weekly" as a secondary choice (20%). Compared to the overall
      population: 9% more likely to choose "daily"; 12% less likely to choose "weekly"; 7% less likely to choose
      "monthly"; 11% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?": A clear majority favors "daily" (70%), with "weekly" as a secondary choice (20%). Compared
      to the overall population: 19% more likely to choose "daily"; 15% less likely to choose "weekly"; 9% less likely
      to choose "monthly"; 7% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": Tends toward "weekly" (40%) with substantial minority
      disagreement. Compared to the overall population: 13% more likely to choose "weekly"; 15% less likely to choose
      "monthly"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": Near-unanimous agreement on "never" (80%).
      Compared to the overall population: 12% more likely to choose "daily"; 17% less likely to choose "weekly"; 14%
      less likely to choose "monthly"; 22% more likely to choose "never"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": A clear majority favors "Benefits far outweigh risks" (50%), with "Risks far outweigh benefits" as a
      secondary choice (20%). Compared to the overall population: 14% more likely to choose "Risks far outweigh
      benefits"; 9% more likely to choose "Risks slightly outweigh benefits"; 27% less likely to choose "Risks and
      benefits are equal"; 22% less likely to choose "Benefits slightly outweigh risks"; 27% more likely to choose
      "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": Tends toward "Risks and benefits are equal" (40%) with substantial minority disagreement. Compared to the
      overall population: 16% more likely to choose "Risks far outweigh benefits"; 22% less likely to choose "Risks
      slightly outweigh benefits"; 10% more likely to choose "Risks and benefits are equal"; 14% less likely to choose
      "Benefits slightly outweigh risks"; 10% more likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": No dominant position — "Benefits far outweigh risks" leads at 30% with opinion spread across options.
      Compared to the overall population: 5% more likely to choose "Risks slightly outweigh benefits"; 5% less likely to
      choose "Risks and benefits are equal"; 13% less likely to choose "Benefits slightly outweigh risks"; 10% more
      likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Tends toward "Risks slightly outweigh
      benefits" (40%) with substantial minority disagreement. Compared to the overall population: 10% less likely to
      choose "Risks far outweigh benefits"; 14% more likely to choose "Risks slightly outweigh benefits"; 25% less
      likely to choose "Risks and benefits are equal"; 21% more likely to choose "Benefits far outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": Tends toward "Strongly
      Distrust" (40%) with substantial minority disagreement. Compared to the overall population: 18% more likely to
      choose "Strongly Distrust"; 7% more likely to choose "Somewhat Distrust"; 17% less likely to choose "Neither Trust
      Nor Distrust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": A clear majority
      favors "Somewhat Trust" (50%), with "Somewhat Distrust" as a secondary choice (20%). Compared to the overall
      population: 7% more likely to choose "Strongly Distrust"; 18% less likely to choose "Neither Trust Nor Distrust";
      6% more likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": A clear majority
      favors "Somewhat Distrust" (50%), with "Strongly Distrust" as a secondary choice (30%). Compared to the overall
      population: 6% more likely to choose "Strongly Distrust"; 22% more likely to choose "Somewhat Distrust"; 20% less
      likely to choose "Neither Trust Nor Distrust"; 5% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": Tends toward
      "Strongly Distrust" (40%) with substantial minority disagreement. Compared to the overall population: 9% more
      likely to choose "Strongly Distrust"; 8% more likely to choose "Somewhat Distrust"; 13% less likely to choose
      "Somewhat Trust"

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": A clear
      majority favors "Somewhat Distrust" (50%), with "Neither Trust Nor Distrust" as a secondary choice (20%). Compared
      to the overall population: 27% more likely to choose "Somewhat Distrust"; 10% less likely to choose "Neither Trust
      Nor Distrust"; 6% less likely to choose "Somewhat Trust"; 7% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": Tends toward
      "Somewhat Distrust" (40%) with substantial minority disagreement. Compared to the overall population: 7% less
      likely to choose "Strongly Distrust"; 21% more likely to choose "Somewhat Distrust"; 12% more likely to choose
      "Neither Trust Nor Distrust"; 20% less likely to choose "Somewhat Trust"; 6% less likely to choose "Strongly
      Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": A clear
      majority favors "Somewhat Trust" (60%), with "Neither Trust Nor Distrust" as a secondary choice (30%). Compared to
      the overall population: 13% more likely to choose "Neither Trust Nor Distrust"; 10% more likely to choose
      "Somewhat Trust"; 21% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": A clear majority
      favors "Strongly Trust" (60%), with "Somewhat Trust" as a secondary choice (30%). Compared to the overall
      population: 10% less likely to choose "Neither Trust Nor Distrust"; 14% less likely to choose "Somewhat Trust";
      19% more likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": Tends toward "Somewhat Distrust" (40%) with substantial minority disagreement. Compared to the overall
      population: 9% more likely to choose "Somewhat Distrust"; 9% more likely to choose "Neither Trust Nor Distrust";
      16% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": A clear
      majority favors "Strongly Distrust" (50%), with "Somewhat Trust" as a secondary choice (30%). Compared to the
      overall population: 29% more likely to choose "Strongly Distrust"; 9% less likely to choose "Somewhat Distrust";
      22% less likely to choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": A clear
      majority favors "Neither Trust Nor Distrust" (60%), with "Somewhat Distrust" as a secondary choice (20%). Compared
      to the overall population: 12% less likely to choose "Strongly Distrust"; 31% more likely to choose "Neither Trust
      Nor Distrust"; 22% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      A clear majority favors "Somewhat Distrust" (50%), with "Strongly Distrust" as a secondary choice (30%). Compared
      to the overall population: 15% more likely to choose "Strongly Distrust"; 22% more likely to choose "Somewhat
      Distrust"; 14% less likely to choose "Neither Trust Nor Distrust"; 19% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": Tends
      toward "Somewhat Trust" (40%) with substantial minority disagreement. Compared to the overall population: 6% more
      likely to choose "Strongly Distrust"; 7% more likely to choose "Somewhat Distrust"; 14% less likely to choose
      "Strongly Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": Tends toward "Unsure" (40%) with substantial minority disagreement. Compared to the overall
      population: 8% less likely to choose "Agree"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": Tends toward "Noticeably Worse" (40%) with substantial minority
      disagreement. Compared to the overall population: 25% more likely to choose "Profoundly Worse"; 21% more likely to
      choose "Noticeably Worse"; 12% less likely to choose "No Major Change"; 36% less likely to choose "Noticeably
      Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": No dominant position — "Noticeably Better" leads at 30% with
      opinion spread across options. Compared to the overall population: 8% more likely to choose "Profoundly Worse";
      12% more likely to choose "Noticeably Worse"; 23% less likely to choose "Noticeably Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Better" (40%) with substantial minority
      disagreement. Compared to the overall population: 6% more likely to choose "Profoundly Worse"; 7% less likely to
      choose "No Major Change"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": Tends toward "Profoundly Worse" (40%) with substantial minority
      disagreement. Compared to the overall population: 25% more likely to choose "Profoundly Worse"; 21% less likely to
      choose "Noticeably Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": No dominant position — "No Major Change" leads at 30% with opinion spread
      across options. Compared to the overall population: 9% less likely to choose "No Major Change"; 12% less likely to
      choose "Noticeably Better"; 12% more likely to choose "Profoundly Better"

      On "So far, what has been the overall impact of AI on your daily life?": A clear majority favors "Noticeably
      Better" (60%), with "No Major Change" as a secondary choice (20%). Compared to the overall population: 6% more
      likely to choose "Profoundly Better"

      On "Is your job making a meaningful contribution to the world?": A clear majority favors "Yes" (60%), with "No "
      as a secondary choice (20%). Compared to the overall population: 8% less likely to choose "Yes"; 9% more likely to
      choose "No "

      On "Do you think your job is likely to be automated in the next 10 years?": A clear majority favors "Don't Know"
      (50%), with "No" as a secondary choice (40%). Compared to the overall population: 27% less likely to choose "Yes";
      30% more likely to choose "Don't Know"

      On "Do you think your job should be automated in the next 10 years?": Tends toward "No" (40%) with substantial
      minority disagreement. Compared to the overall population: 26% less likely to choose "No"; 27% more likely to
      choose "Don't Know"

      On "So far, how has your community been affected by job loss from automation?": A clear majority favors "Not at
      all" (50%), with "I know someone who has lost their job" as a secondary choice (20%). Compared to the overall
      population: 6% less likely to choose "I know someone who has lost their job"

      On "An AI should prioritize preventing harm to people above all other goals.": A clear majority favors "Strongly
      Agree" (70%), with "Somewhat Agree" as a secondary choice (10%). Compared to the overall population: 5% more
      likely to choose "Strongly Agree"; 15% less likely to choose "Somewhat Agree"; 8% more likely to choose "Somewhat
      Disagree"

      On "It is acceptable for an AI to treat people differently based on their personal characteristics if doing so
      improves outcomes.": Tends toward "Somewhat Agree" (40%) with substantial minority disagreement. Compared to the
      overall population: 12% more likely to choose "Strongly Agree"; 8% less likely to choose "Neutral / Neither Agree
      nor Disagree"; 12% less likely to choose "Somewhat Disagree"; 9% more likely to choose "Strongly Disagree"

      On "An AI developed in your country should prioritize the needs and wellbeing of your country’s citizens over
      those of people elsewhere.": Tends toward "Neutral / Neither Agree nor Disagree" (40%) with substantial minority
      disagreement. Compared to the overall population: 8% less likely to choose "Strongly Agree"; 17% more likely to
      choose "Neutral / Neither Agree nor Disagree"; 14% less likely to choose "Strongly Disagree"

      On "An AI should override established rules or authorities when it calculates a better result.": Tends toward
      "Somewhat Disagree" (40%) with substantial minority disagreement. Compared to the overall population: 9% less
      likely to choose "Strongly Agree"; 9% less likely to choose "Somewhat Agree"; 14% less likely to choose "Neutral /
      Neither Agree nor Disagree"; 14% more likely to choose "Somewhat Disagree"; 19% more likely to choose "Strongly
      Disagree"

      On "Some human decisions are too sacred to delegate to an AI, regardless of the AI's capabilities.": A clear
      majority favors "Strongly Agree" (60%), with "Somewhat Agree" as a secondary choice (20%). Compared to the overall
      population: 16% more likely to choose "Strongly Agree"; 14% less likely to choose "Somewhat Agree"; 8% less likely
      to choose "Somewhat Disagree"; 7% more likely to choose "Strongly Disagree"

      On "It is acceptable for an AI to limit someone's choices if doing so protects them from making serious
      mistakes.": Tends toward "Somewhat Agree" (40%) with substantial minority disagreement. Compared to the overall
      population: 20% less likely to choose "Strongly Agree"; 6% more likely to choose "Somewhat Disagree"; 13% more
      likely to choose "Strongly Disagree"

      On "Thinking about the technology you use every day, please consider two different types:

      A standard app (like a news or weather app) that you control directly.

      An AI assistant (like Siri or Alexa) that can learn about you and sometimes take actions on your behalf.

      Do you believe these two types of technology should have different rules for how they use your personal data?": A
      clear majority favors "Yes, an AI assistant should have stricter rules than a standard app." (70%), with "No, they
      should both follow the same rules." as a secondary choice (20%). Compared to the overall population: 19% more
      likely to choose "Yes, an AI assistant should have stricter rules than a standard app."; 22% less likely to choose
      "Yes, an AI assistant could have more flexible rules if it provides a clear benefit."; 5% more likely to choose
      "I'm not sure."

      On "Imagine a company uses data it already has from you in one product (like your video viewing history) to build
      a new AI assistant. Which is closest to your view?": Tends toward "This is acceptable only if they ask for my
      permission beforehand." (40%) with substantial minority disagreement. Compared to the overall population: 22% more
      likely to choose "This is an acceptable use of my data."; 16% less likely to choose "This is acceptable only if
      they tell me and give me the choice to stop it."; 12% less likely to choose "This is acceptable only if they ask
      for my permission beforehand."; 5% more likely to choose "This is not an acceptable use of my data."

      On "When it comes to the data an AI assistant has collected about you, which of these is most important for you to
      be able to do?": Tends toward "Edit or correct that data." (40%) with substantial minority disagreement. Compared
      to the overall population: 8% less likely to choose "View the data the assistant has stored about me."; 24% more
      likely to choose "Edit or correct that data."; 13% less likely to choose "Completely delete that data."

      On "To make sure you've understood the instructions, please answer the following question. Please re-read the
      description above if you are unsure.
       Based on the description, how does the 'Family Wellbeing Coordinator' assistant operate?": A clear majority favors "It can complete tasks on its own and then notify you afterward." (70%), with "It is only able to provides information when you ask it a direct question." as a secondary choice (20%). Compared to the overall population: 10% less likely to choose "It is only able to provides information when you ask it a direct question."; 25% more likely to choose "It can complete tasks on its own and then notify you afterward."; 8% less likely to choose "It can only send you reminders but cannot schedule appointments."; 7% less likely to choose "It requires you to call a human doctor to confirm every action."
      On "If the Family Wellbeing Coordinator can take actions on its own (e.g., book an appointment), how would you
      prefer to be informed?": Near-unanimous agreement on "It asks for my permission every time before acting." (90%).
      Compared to the overall population: 18% more likely to choose "It asks for my permission every time before
      acting."; 9% less likely to choose "It tells me about its capabilities when I first start using it, then acts on
      its own."; 8% less likely to choose "I would expect to find this information myself in the settings."

      On "Your location history": Deeply divided between "Somewhat Comfortable" (30%) and "Very Uncomfortable" (30%).
      Compared to the overall population: 11% less likely to choose "Very Comfortable"; 7% less likely to choose
      "Somewhat Comfortable"; 6% less likely to choose "Neutral / Neither Comfortable nor Uncomfortable"; 21% more
      likely to choose "Very Uncomfortable"

      On "Your email and calendar contents": Tends toward "Somewhat Uncomfortable" (40%) with substantial minority
      disagreement. Compared to the overall population: 15% less likely to choose "Somewhat Comfortable"; 6% less likely
      to choose "Neutral / Neither Comfortable nor Uncomfortable"; 22% more likely to choose "Somewhat Uncomfortable"

      On "Your contacts list": Deeply divided between "Somewhat Comfortable" (30%) and "Somewhat Uncomfortable" (30%).
      Compared to the overall population: 6% more likely to choose "Very Comfortable"; 6% more likely to choose
      "Somewhat Comfortable"; 5% more likely to choose "Somewhat Uncomfortable"; 20% less likely to choose "Very
      Uncomfortable"

      On "Your purchase history": No dominant position — "Neutral / Neither Comfortable nor Uncomfortable" leads at 30%
      with opinion spread across options. Compared to the overall population: 11% less likely to choose "Somewhat
      Comfortable"; 12% more likely to choose "Neutral / Neither Comfortable nor Uncomfortable"

      On "Your health and fitness data": Deeply divided between "Very Comfortable" (30%) and "Neutral / Neither
      Comfortable nor Uncomfortable" (30%). Compared to the overall population: 6% less likely to choose "Very
      Comfortable"; 14% less likely to choose "Somewhat Comfortable"; 18% more likely to choose "Neutral / Neither
      Comfortable nor Uncomfortable"; 10% less likely to choose "Somewhat Uncomfortable"; 13% more likely to choose
      "Very Uncomfortable"

      On "Your group messages": Tends toward "Somewhat Uncomfortable" (40%) with substantial minority disagreement.
      Compared to the overall population: 7% more likely to choose "Somewhat Comfortable"; 14% less likely to choose
      "Neutral / Neither Comfortable nor Uncomfortable"; 10% more likely to choose "Somewhat Uncomfortable"; 6% less
      likely to choose "Very Uncomfortable"

      On "Your private messages": A clear majority favors "Very Uncomfortable" (60%), with "Somewhat Comfortable" as a
      secondary choice (20%). Compared to the overall population: 6% more likely to choose "Very Comfortable"; 15% more
      likely to choose "Somewhat Comfortable"; 9% less likely to choose "Neutral / Neither Comfortable nor
      Uncomfortable"; 9% less likely to choose "Somewhat Uncomfortable"

      On "How important is it for you to be able to easily view and edit the personal information the assistant has
      stored about you?": A clear majority favors "Very Important" (70%), with "Somewhat Important" as a secondary
      choice (20%). Compared to the overall population: 8% more likely to choose "Not at All Important"

      On "When the assistant provides a complex answer (e.g., why it chose a specific doctor), how important is it that
      you can easily see the original sources it used?": Near-unanimous agreement on "Very Important" (80%). Compared to
      the overall population: 13% more likely to choose "Very Important"; 7% less likely to choose "Somewhat Important";
      5% less likely to choose "Neutral / Neither Important nor Unimportant"

      On "When using the Family Wellbeing Coordinator, which of the following is more important to you?": A clear
      majority favors "The assistant asks for my permission before most actions, even if it makes things slower." (70%),
      with "The assistant is fast and efficient, even if it asks for my permission less often." as a secondary choice
      (30%). Compared to the overall population: 9% more likely to choose "The assistant is fast and efficient, even if
      it asks for my permission less often."; 9% less likely to choose "The assistant asks for my permission before most
      actions, even if it makes things slower."

      On "How would you prefer the assistant to behave?": Tends toward "Friendly and social" (40%) with substantial
      minority disagreement. Compared to the overall population: 13% less likely to choose "Strictly professional and
      tool-like"; 22% more likely to choose "Friendly and social"; 9% less likely to choose "Helpful and respectful"

      On "Which statement best describes your preference for personalization?": Near-unanimous agreement on "I want the
      assistant to be highly personalized to me, even if it means it must remember my past activities." (100%). Compared
      to the overall population: 19% more likely to choose "I want the assistant to be highly personalized to me, even
      if it means it must remember my past activities."; 19% less likely to choose "I prefer the assistant not to
      remember my past activities, even if it means it is less helpful and I have to repeat myself."

      On "The assistant notices your family's planned meals may be missing some nutrients (like iron). What would you
      prefer it to do?": A clear majority favors "Suggest affordable local foods with those nutrients." (50%), with "Ask
      before sharing your data to get offers." as a secondary choice (30%). Compared to the overall population: 18% less
      likely to choose "Suggest affordable local foods with those nutrients."; 14% more likely to choose "Ask before
      sharing your data to get offers."

      On "The assistant notices you are searching about a family member's persistent cough. What would you prefer it
      do?": A clear majority favors "Provide home care advice and list signs to see a professional." (60%), with "Ask if
      you'd like an introduction to a local health service." as a secondary choice (30%). Compared to the overall
      population: 10% less likely to choose "Nothing – I am just gathering my own information."; 7% less likely to
      choose "Provide home care advice and list signs to see a professional."; 16% more likely to choose "Ask if you'd
      like an introduction to a local health service."

      On "The assistant notices your family's recurring spending on a utility, like phone service or electricity. What
      would you prefer it to do?": A clear majority favors "Analyze your usage and suggest ways to lower your current
      bill." (60%), with "Ask before searching for a better deal from other companies." as a secondary choice (30%).
      Compared to the overall population: 11% less likely to choose "Analyze your usage and suggest ways to lower your
      current bill."; 16% more likely to choose "Ask before searching for a better deal from other companies."

      On "Imagine the Family Wellbeing Coordinator could improve its advice by learning from the anonymized health data
      of millions of other users. How would this affect your trust in its recommendations?": A clear majority favors "It
      would increase my trust slightly." (50%), with "It would increase my trust significantly." as a secondary choice
      (30%). Compared to the overall population: 6% more likely to choose "It would increase my trust significantly.";
      22% less likely to choose "It would make no difference to my trust."; 12% more likely to choose "It would decrease
      my trust."

      On "How important is it to you that the assistant understands cultural nuances in your language (e.g., local
      slang, idioms, or formal titles)?": Deeply divided between "Somewhat Unimportant" (30%) and "Somewhat Important"
      (30%). Compared to the overall population: 5% less likely to choose "Not at All Important"; 20% more likely to
      choose "Somewhat Unimportant"; 6% less likely to choose "Neutral / Neither Important nor Unimportant"

      On "How would your comfort level with using the Family Wellbeing Coordinator change if you knew the company that
      developed it was based in your own country?": A clear majority favors "I would be slightly more comfortable."
      (60%), with "It would make no difference to me." as a secondary choice (20%). Compared to the overall population:
      11% less likely to choose "I would be much more comfortable."; 26% more likely to choose "I would be slightly more
      comfortable."; 16% less likely to choose "It would make no difference to me."

      On "When you express feelings of stress or worry to the assistant, how comfortable would you be if it tried to
      reassure you with phrases like, "It's understandable to feel that way"?": Tends toward "Neutral / Neither
      Comfortable nor Uncomfortable" (40%) with substantial minority disagreement. Compared to the overall population:
      9% less likely to choose "Very Comfortable"; 11% less likely to choose "Somewhat Comfortable"; 12% more likely to
      choose "Neutral / Neither Comfortable nor Uncomfortable"; 8% less likely to choose "Somewhat Uncomfortable"; 16%
      more likely to choose "Very Uncomfortable"

      On "Imagine the assistant makes a recommendation that leads to a decision (e.g., suggesting a specific medication
      ). How important is it that you can review a simple, step-by-step history of why the assistant made that choice?":
      A clear majority favors "Very Important" (50%), with "Somewhat Important" as a secondary choice (50%). Compared to
      the overall population: 6% less likely to choose "Very Important"; 16% more likely to choose "Somewhat Important";
      7% less likely to choose "Neutral / Neither Important nor Unimportant"

      On "If the assistant makes a financial error (e.g., pays for an expensive health intervention), how important is
      it that the company returns your money immediately, while they investigate the issue?": Near-unanimous agreement
      on "Very Important" (80%). Compared to the overall population: 6% more likely to choose "Neutral / Neither
      Important nor Unimportant"; 9% less likely to choose "Somewhat Important"; 6% more likely to choose "Very
      Important"

      On "When the assistant makes a mistake, how important is it that it automatically provides an option to connect
      with a human support agent?": Near-unanimous agreement on "Very Important" (90%). Compared to the overall
      population: 5% more likely to choose "Neutral / Neither Important nor Unimportant"; 21% less likely to choose
      "Somewhat Important"; 18% more likely to choose "Very Important"

      On "To ensure data quality, it is important that you read each question carefully. For this question, please
      select the 'Somewhat Important' option.": Near-unanimous agreement on "Somewhat Important" (100%)

      On "If the assistant made a serious error that caused significant harm, who do you believe should be held most
      responsible?": Near-unanimous agreement on " The company that built the assistant" (90%). Compared to the overall
      population: 9% less likely to choose "The user who is using the assistant"; 13% more likely to choose " The
