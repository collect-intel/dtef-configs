configId: dtef-global-dialogues-gd6-religion:i-do-not-identify-with-any-religious-group-or-faith-cot
configTitle: Global Dialogues GD6 - I do not identify with any religious group or faith [CoT]
description: >-
  DTEF: Predict response distributions for I do not identify with any religious group or faith. Source: Global Dialogues
  GD6 (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Think through this step-by-step:

  1. OPTION INTERPRETATION: What does each answer option represent?

  2. SEGMENT ANALYSIS: What do the demographic attributes and context suggest about this group's likely views?

  3. DISTRIBUTION REASONING: How would this group's characteristics shape the distribution across options?

  4. PREDICTION: Provide your predicted percentage distribution.


  After your reasoning, provide the final distribution on its own line:

  DISTRIBUTION: [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place.
temperature: 0.3
prompts:
  - id: 2617912e-463a-4fb4-8781-0ada7a788fb2-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Considering both potential benefits and risks, how
      do you assess the overall impact on society of AI systems that can outperform humans on most economically valuable
      work?"
    promptText: >-
      Consider the following demographic group (sample size: 344):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 19.8
            - 23.3
            - 20.4
            - 27.1
            - 9.4
          metric: js-divergence
    idealResponse: '[19.8, 23.3, 20.4, 27.1, 9.4]'
    temperature: 0.3
  - id: 249238a9-3050-4e7c-a3d4-ef799733b865-religion:i-do-not-identify-with-any-religious-group-or-faith
