    description: >-
      Predict: Türkiye → "Thinking about the last three months, how often, if at all, have you personally chosen to use
      an AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 10):

      - Country: Türkiye


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "More excited than concerned" (50%), with "Equally concerned and excited" as a secondary
      choice (40%). Compared to the overall population: 16% more likely to choose "More excited than concerned"; 15%
      less likely to choose "Equally concerned and excited"

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (90%). Compared to the overall population: 22% more likely to choose "daily";
      16% less likely to choose "weekly"; 5% less likely to choose "monthly"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": A clear majority favors "weekly" (56%), with "daily" as a secondary choice
      (22%). Compared to the overall population: 9% less likely to choose "daily"; 12% more likely to choose "weekly";
      17% less likely to choose "monthly"; 19% more likely to choose "annually"; 5% less likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": Tends toward "daily" (44%) with substantial minority disagreement. Compared to the overall population: 8%
      less likely to choose "weekly"; 12% more likely to choose "monthly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": Near-unanimous agreement on "daily" (78%). Compared to the overall population: 28% more likely to choose
      "daily"; 9% less likely to choose "weekly"; 10% less likely to choose "monthly"; 7% less likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": Tends toward "never" (44%) with substantial minority
      disagreement. Compared to the overall population: 6% more likely to choose "weekly"; 9% less likely to choose
      "monthly"; 6% less likely to choose "annually"; 12% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": A clear majority favors "never" (56%), with
      "weekly" as a secondary choice (33%). Compared to the overall population: 13% more likely to choose "weekly"; 15%
      less likely to choose "monthly"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": Tends toward "Benefits slightly outweigh risks" (44%) with substantial minority disagreement. Compared to
      the overall population: 7% more likely to choose "Risks far outweigh benefits"; 9% less likely to choose "Risks
      slightly outweigh benefits"; 5% more likely to choose "Risks and benefits are equal"; 10% more likely to choose
      "Benefits slightly outweigh risks"; 14% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": A clear majority favors "Risks and benefits are equal" (56%), with "Risks slightly outweigh benefits" as a
      secondary choice (22%). Compared to the overall population: 26% more likely to choose "Risks and benefits are
      equal"; 16% less likely to choose "Benefits slightly outweigh risks"; 12% less likely to choose "Benefits far
      outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": Tends toward "Benefits slightly outweigh risks" (44%) with substantial minority disagreement. Compared
      to the overall population: 5% more likely to choose "Risks far outweigh benefits"; 18% more likely to choose
      "Risks slightly outweigh benefits"; 25% less likely to choose "Risks and benefits are equal"; 12% more likely to
      choose "Benefits slightly outweigh risks"; 11% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Tends toward "Risks and benefits are equal"
      (44%) with substantial minority disagreement. Compared to the overall population: 24% less likely to choose "Risks
      slightly outweigh benefits"; 19% more likely to choose "Risks and benefits are equal"; 12% more likely to choose
      "Benefits slightly outweigh risks"; 11% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?": A clear majority favors "Risks slightly outweigh
      benefits" (56%), with "Risks and benefits are equal" as a secondary choice (33%). Compared to the overall
      population: 19% less likely to choose "Risks far outweigh benefits"; 30% more likely to choose "Risks slightly
      outweigh benefits"; 11% more likely to choose "Risks and benefits are equal"; 11% less likely to choose "Benefits
      slightly outweigh risks"; 11% less likely to choose "Benefits far outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": Tends toward "Neither
      Trust Nor Distrust" (44%) with substantial minority disagreement. Compared to the overall population: 9% less
      likely to choose "Somewhat Distrust"; 27% more likely to choose "Neither Trust Nor Distrust"; 14% less likely to
      choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": Tends toward
      "Neither Trust Nor Distrust" (44%) with substantial minority disagreement. Compared to the overall population: 6%
      more likely to choose "Somewhat Distrust"; 18% more likely to choose "Neither Trust Nor Distrust"; 11% less likely
      to choose "Somewhat Trust"; 10% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": Deeply divided
      between "Strongly Distrust" (33%) and "Neither Trust Nor Distrust" (33%). Compared to the overall population: 13%
      more likely to choose "Strongly Distrust"; 16% less likely to choose "Somewhat Distrust"; 11% more likely to
      choose "Neither Trust Nor Distrust"; 5% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": Tends toward
      "Somewhat Distrust" (44%) with substantial minority disagreement. Compared to the overall population: 12% more
      likely to choose "Somewhat Distrust"; 8% less likely to choose "Neither Trust Nor Distrust"; 5% less likely to
      choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": No dominant
      position — "Somewhat Distrust" leads at 33% with opinion spread across options. Compared to the overall
      population: 10% more likely to choose "Strongly Distrust"; 9% more likely to choose "Somewhat Distrust"; 8% less
      likely to choose "Neither Trust Nor Distrust"; 16% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": A clear
      majority favors "Neither Trust Nor Distrust" (67%), with "Somewhat Trust" as a secondary choice (22%). Compared to
      the overall population: 6% less likely to choose "Strongly Distrust"; 9% less likely to choose "Somewhat
      Distrust"; 37% more likely to choose "Neither Trust Nor Distrust"; 16% less likely to choose "Somewhat Trust"; 6%
      less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": A clear
      majority favors "Somewhat Trust" (56%), with "Neither Trust Nor Distrust" as a secondary choice (33%). Compared to
      the overall population: 13% more likely to choose "Neither Trust Nor Distrust"; 9% more likely to choose "Somewhat
      Trust"; 22% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": Near-unanimous
      agreement on "Somewhat Trust" (78%). Compared to the overall population: 10% less likely to choose "Neither Trust
      Nor Distrust"; 37% more likely to choose "Somewhat Trust"; 21% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": Tends toward "Somewhat Distrust" (44%) with substantial minority disagreement. Compared to the overall
      population: 10% more likely to choose "Strongly Distrust"; 11% more likely to choose "Somewhat Distrust"; 17% less
      likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?":
      Near-unanimous agreement on "Somewhat Distrust" (78%). Compared to the overall population: 50% more likely to
      choose "Somewhat Distrust"; 23% less likely to choose "Neither Trust Nor Distrust"; 25% less likely to choose
      "Somewhat Trust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": A clear
      majority favors "Somewhat Distrust" (56%), with "Strongly Distrust" as a secondary choice (22%). Compared to the
      overall population: 11% more likely to choose "Strongly Distrust"; 38% more likely to choose "Somewhat Distrust";
      33% less likely to choose "Somewhat Trust"; 11% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      Tends toward "Strongly Distrust" (44%) with substantial minority disagreement. Compared to the overall population:
      26% more likely to choose "Strongly Distrust"; 11% less likely to choose "Neither Trust Nor Distrust"; 14% less
      likely to choose "Somewhat Trust"; 6% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": A clear
      majority favors "Somewhat Trust" (56%), with "Neither Trust Nor Distrust" as a secondary choice (33%). Compared to
      the overall population: 5% more likely to choose "Neither Trust Nor Distrust"; 14% more likely to choose "Somewhat
      Trust"; 16% less likely to choose "Strongly Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": A clear majority favors "Unsure" (56%), with "Agree" as a secondary choice (22%). Compared to
      the overall population: 15% less likely to choose "Agree"; 7% less likely to choose "Disagree"; 22% more likely to
      choose "Unsure"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": Deeply divided between "Noticeably Better" (33%) and "Profoundly Better"
      (33%). Compared to the overall population: 8% less likely to choose "Noticeably Worse"; 13% less likely to choose
      "Noticeably Better"; 23% more likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (56%), with "No Major
      Change" as a secondary choice (33%). Compared to the overall population: 11% more likely to choose "No Major
      Change"; 17% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (56%), with "No Major
      Change" as a secondary choice (44%). Compared to the overall population: 15% less likely to choose "Noticeably
      Worse"; 18% more likely to choose "No Major Change"; 13% more likely to choose "Noticeably Better"; 12% less
      likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Better" (44%) with substantial minority
      disagreement. Compared to the overall population: 12% less likely to choose "Profoundly Worse"; 6% less likely to
      choose "Noticeably Worse"; 5% more likely to choose "No Major Change"; 21% more likely to choose "Noticeably
      Better"; 8% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": Tends toward "Noticeably Better" (44%) with substantial minority
      disagreement. Compared to the overall population: 5% less likely to choose "Profoundly Worse"; 19% more likely to
      choose "Noticeably Worse"; 16% less likely to choose "No Major Change"; 12% more likely to choose "Noticeably
      Better"; 10% less likely to choose "Profoundly Better"

      On "So far, what has been the overall impact of AI on your daily life?": Deeply divided between "Noticeably
      Better" (33%) and "Profoundly Better" (33%). Compared to the overall population: 7% more likely to choose
      "Noticeably Worse"; 20% less likely to choose "Noticeably Better"; 15% more likely to choose "Profoundly Better"

      On "Is your job making a meaningful contribution to the world?": Tends toward "Yes" (44%) with substantial
      minority disagreement. Compared to the overall population: 26% less likely to choose "Yes"; 10% more likely to
      choose "No "; 16% more likely to choose "Don't Know"

      On "Do you think your job is likely to be automated in the next 10 years?": A clear majority favors "No" (56%),
      with "Yes" as a secondary choice (22%). Compared to the overall population: 17% less likely to choose "Yes"; 13%
      more likely to choose "No"

      On "Do you think your job should be automated in the next 10 years?": A clear majority favors "No" (67%), with
      "Don't Know" as a secondary choice (22%). Compared to the overall population: 11% less likely to choose "Yes"; 9%
      more likely to choose "Don't Know"

      On "So far, how has your community been affected by job loss from automation?": A clear majority favors "Not at
      all" (67%), with "I know someone who has lost their job" as a secondary choice (22%). Compared to the overall
      population: 19% more likely to choose "Not at all"; 22% less likely to choose "I know several people who have lost
      their job"; 6% more likely to choose "I know many people who have lost their job"

      On "Do you agree or disagree?": Near-unanimous agreement on "Agree" (89%). Compared to the overall population: 5%
      less likely to choose "Agree"; 5% more likely to choose "Disagree"

      On "Do you agree or disagree?": Near-unanimous agreement on "Agree" (78%). Compared to the overall population: 13%
      less likely to choose "Agree"; 13% more likely to choose "Disagree"

      On "Do you agree or disagree?": A clear majority favors "Disagree" (67%), with "Agree" as a secondary choice
      (33%). Compared to the overall population: 5% less likely to choose "Agree"; 5% more likely to choose "Disagree"

      On "Do you agree or disagree?": A clear majority favors "Agree" (56%), with "Disagree" as a secondary choice
      (44%). Compared to the overall population: 8% less likely to choose "Agree"; 8% more likely to choose "Disagree"

      On "Do you feel you were able to fully express your views on your culture, your values, and what you want for the
      future in this conversation? (through what you responded and how you voted)": A clear majority favors "Yes – I was
      able to fully express my views on these topics" (67%), with "Mostly – I was able to mostly express my views on
      these topics, but did not have the chance to express a few things." as a secondary choice (33%). Compared to the
      overall population: 8% more likely to choose "Mostly – I was able to mostly express my views on these topics, but
      did not have the chance to express a few things."

      On "Do you feel like you understand yourself better after participating in this conversation?": Near-unanimous
      agreement on "Yes" (78%). Compared to the overall population: 17% more likely to choose "Yes"; 12% less likely to
      choose "Maybe a little"


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
