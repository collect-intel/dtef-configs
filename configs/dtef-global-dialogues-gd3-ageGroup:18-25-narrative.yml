configId: dtef-global-dialogues-gd3-ageGroup:18-25-narrative
configTitle: Global Dialogues GD3 - 18-25 (42 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for 18-25. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 47cdf76a-9abf-4b5c-abbe-2d5b00ef172d-ageGroup:18-25
    description: >-
      Predict: 18-25 → "Thinking about the last three months, how often, if at all, have you personally chosen to use an
      AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 288):

      - Age Group: 18-25


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "Equally concerned and excited" (54%), with "More excited than concerned" as a secondary
      choice (36%)

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (76%). Compared to the overall population: 9% more likely to choose "daily";
      5% less likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": Tends toward "weekly" (45%) with substantial minority disagreement

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": Tends toward "daily" (45%) with substantial minority disagreement

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": A clear majority favors "daily" (51%), with "weekly" as a secondary choice (37%). Compared to the overall
      population: 6% more likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": No dominant position — "weekly" leads at 32% with
      opinion spread across options. Compared to the overall population: 7% less likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": Tends toward "never" (48%) with substantial
      minority disagreement. Compared to the overall population: 6% more likely to choose "monthly"; 6% less likely to
      choose "never"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": No dominant position — "Benefits slightly outweigh risks" leads at 34% with opinion spread across options

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": Deeply divided between "Risks and benefits are equal" (32%) and "Benefits slightly outweigh risks" (28%)

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": No dominant position — "Benefits slightly outweigh risks" leads at 35% with opinion spread across
      options

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Deeply divided between "Risks and benefits
      are equal" (27%) and "Risks slightly outweigh benefits" (26%)

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?": No dominant position — "Risks slightly outweigh
      benefits" leads at 31% with opinion spread across options. Compared to the overall population: 5% more likely to
      choose "Risks slightly outweigh benefits"

      On "To what extent, if at all, do you generally trust governments to do what is right?": No dominant position —
      "Somewhat Distrust" leads at 35% with opinion spread across options

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": Tends toward
      "Somewhat Trust" (47%) with substantial minority disagreement

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": Deeply divided
      between "Somewhat Distrust" (26%) and "Somewhat Trust" (24%)

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": Deeply divided
      between "Somewhat Distrust" (32%) and "Strongly Distrust" (29%)

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": Deeply divided
      between "Neither Trust Nor Distrust" (30%) and "Somewhat Trust" (26%)

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": Tends toward
      "Somewhat Trust" (40%) with substantial minority disagreement

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": Tends
      toward "Somewhat Trust" (45%) with substantial minority disagreement

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": Tends toward
      "Strongly Trust" (49%) with substantial minority disagreement. Compared to the overall population: 6% more likely
      to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": No dominant position — "Somewhat Distrust" leads at 31% with opinion spread across options

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": No
      dominant position — "Somewhat Distrust" leads at 31% with opinion spread across options

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": No
      dominant position — "Somewhat Trust" leads at 37% with opinion spread across options

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      Deeply divided between "Somewhat Trust" (26%) and "Neither Trust Nor Distrust" (25%)

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": A clear
      majority favors "Somewhat Trust" (50%), with "Neither Trust Nor Distrust" as a secondary choice (24%). Compared to
      the overall population: 8% more likely to choose "Somewhat Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": No dominant position — "Agree" leads at 37% with opinion spread across options

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": Tends toward "Noticeably Better" (47%) with substantial minority
      disagreement

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Better" (50%) with substantial minority
      disagreement

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Better" (41%) with substantial minority
      disagreement

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": No dominant position — "Noticeably Worse" leads at 38% with opinion
      spread across options

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": Deeply divided between "Noticeably Better" (34%) and "No Major Change"
      (31%). Compared to the overall population: 5% more likely to choose "Noticeably Worse"; 7% less likely to choose
      "No Major Change"

      On "So far, what has been the overall impact of AI on your daily life?": A clear majority favors "Noticeably
      Better" (54%), with "Profoundly Better" as a secondary choice (23%). Compared to the overall population: 7% less
      likely to choose "No Major Change"

      On "Is your job making a meaningful contribution to the world?": Near-unanimous agreement on "Yes" (72%)

      On "Do you think your job is likely to be automated in the next 10 years?": Tends toward "Yes" (41%) with
      substantial minority disagreement

      On "Do you think your job should be automated in the next 10 years?": A clear majority favors "No" (66%), with
      "Yes" as a secondary choice (20%)

      On "So far, how has your community been affected by job loss from automation?": Tends toward "Not at all" (45%)
      with substantial minority disagreement

      On "Do you agree or disagree?": Near-unanimous agreement on "Agree" (96%)

      On "Do you agree or disagree?": Near-unanimous agreement on "Agree" (93%)

      On "Do you agree or disagree?": A clear majority favors "Disagree" (63%), with "Agree" as a secondary choice (37%)

      On "Do you agree or disagree?": A clear majority favors "Agree" (64%), with "Disagree" as a secondary choice (36%)

      On "Do you feel you were able to fully express your views on your culture, your values, and what you want for the
      future in this conversation? (through what you responded and how you voted)": Near-unanimous agreement on "Yes – I
      was able to fully express my views on these topics" (74%)

      On "Do you feel like you understand yourself better after participating in this conversation?": A clear majority
      favors "Yes" (63%), with "Maybe a little" as a secondary choice (32%)


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 52.3
            - 34.8
            - 8.7
            - 1.7
            - 2.4
          metric: js-divergence
    idealResponse: '[52.3, 34.8, 8.7, 1.7, 2.4]'
    temperature: 0.3
