configId: dtef-global-dialogues-gd7-country:t-rkiye-narrative
configTitle: Global Dialogues GD7 - Türkiye (53 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for Türkiye. Source: Global Dialogues GD7
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 3715e9a1-f652-48be-8a15-7a9deb802a1b-country:t-rkiye
    description: >-
      Predict: Türkiye → "Do you agree or disagree with this statement? AI could make better decisions on my behalf than
      my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 10):

      - Country: Türkiye


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "Equally concerned and excited" (70%), with "More excited than concerned" as a secondary
      choice (20%). Compared to the overall population: 15% less likely to choose "More excited than concerned"; 19%
      more likely to choose "Equally concerned and excited"

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (90%). Compared to the overall population: 13% more likely to choose "daily";
      10% less likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": A clear majority favors "weekly" (60%), with "daily" as a secondary choice
      (20%). Compared to the overall population: 6% less likely to choose "daily"; 14% more likely to choose "weekly";
      12% less likely to choose "monthly"; 7% more likely to choose "annually"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": A clear majority favors "weekly" (50%), with "daily" as a secondary choice (20%). Compared to the overall
      population: 23% less likely to choose "daily"; 19% more likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": A clear majority favors "weekly" (50%), with "daily" as a secondary choice (40%). Compared to the overall
      population: 11% less likely to choose "daily"; 20% more likely to choose "weekly"; 7% less likely to choose
      "monthly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?": A clear majority favors "daily" (60%), with "weekly" as a secondary choice (40%). Compared
      to the overall population: 9% more likely to choose "daily"; 6% more likely to choose "weekly"; 9% less likely to
      choose "monthly"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": A clear majority favors "monthly" (70%), with
      "weekly" as a secondary choice (20%). Compared to the overall population: 12% less likely to choose "daily"; 5%
      less likely to choose "weekly"; 43% more likely to choose "monthly"; 21% less likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": A clear majority favors "never" (60%), with
      "monthly" as a secondary choice (20%)

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": A clear majority favors "Risks and benefits are equal" (50%), with "Benefits far outweigh risks" as a
      secondary choice (30%). Compared to the overall population: 6% less likely to choose "Risks far outweigh
      benefits"; 10% more likely to choose "Risks slightly outweigh benefits"; 19% more likely to choose "Risks and
      benefits are equal"; 28% less likely to choose "Benefits slightly outweigh risks"; 5% more likely to choose
      "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": Tends toward "Risks slightly outweigh benefits" (40%) with substantial minority disagreement. Compared to
      the overall population: 14% less likely to choose "Risks far outweigh benefits"; 17% more likely to choose "Risks
      slightly outweigh benefits"; 9% more likely to choose "Risks and benefits are equal"; 9% less likely to choose
      "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": Tends toward "Benefits slightly outweigh risks" (40%) with substantial minority disagreement. Compared
      to the overall population: 7% less likely to choose "Risks far outweigh benefits"; 15% more likely to choose
      "Risks slightly outweigh benefits"; 5% more likely to choose "Risks and benefits are equal"; 6% more likely to
      choose "Benefits slightly outweigh risks"; 20% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Deeply divided between "Risks far outweigh
      benefits" (30%) and "Risks slightly outweigh benefits" (30%). Compared to the overall population: 8% more likely
      to choose "Risks far outweigh benefits"; 5% more likely to choose "Risks and benefits are equal"; 8% less likely
      to choose "Benefits slightly outweigh risks"; 8% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?": A clear majority favors "Risks slightly outweigh
      benefits" (50%), with "Risks and benefits are equal" as a secondary choice (20%). Compared to the overall
      population: 12% less likely to choose "Risks far outweigh benefits"; 25% more likely to choose "Risks slightly
      outweigh benefits"; 5% less likely to choose "Risks and benefits are equal"; 10% less likely to choose "Benefits
      far outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": A clear majority favors
      "Somewhat Distrust" (70%), with "Neither Trust Nor Distrust" as a secondary choice (20%). Compared to the overall
      population: 22% less likely to choose "Strongly Distrust"; 37% more likely to choose "Somewhat Distrust"; 13% less
      likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": A clear majority
      favors "Somewhat Distrust" (50%), with "Neither Trust Nor Distrust" as a secondary choice (40%). Compared to the
      overall population: 36% more likely to choose "Somewhat Distrust"; 13% more likely to choose "Neither Trust Nor
      Distrust"; 36% less likely to choose "Somewhat Trust"; 9% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": A clear majority
      favors "Strongly Distrust" (50%), with "Somewhat Distrust" as a secondary choice (30%). Compared to the overall
      population: 26% more likely to choose "Strongly Distrust"; 18% less likely to choose "Neither Trust Nor Distrust";
      7% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": Tends toward
      "Strongly Distrust" (40%) with substantial minority disagreement. Compared to the overall population: 7% more
      likely to choose "Strongly Distrust"

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": A clear
      majority favors "Neither Trust Nor Distrust" (60%), with "Somewhat Distrust" as a secondary choice (30%). Compared
      to the overall population: 14% less likely to choose "Strongly Distrust"; 7% more likely to choose "Somewhat
      Distrust"; 28% more likely to choose "Neither Trust Nor Distrust"; 15% less likely to choose "Somewhat Trust"; 6%
      less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": A clear
      majority favors "Neither Trust Nor Distrust" (50%), with "Somewhat Distrust" as a secondary choice (20%). Compared
      to the overall population: 20% more likely to choose "Neither Trust Nor Distrust"; 19% less likely to choose
      "Somewhat Trust"; 6% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": A clear
      majority favors "Somewhat Trust" (70%), with "Somewhat Distrust" as a secondary choice (20%). Compared to the
      overall population: 13% more likely to choose "Somewhat Distrust"; 8% less likely to choose "Neither Trust Nor
      Distrust"; 19% more likely to choose "Somewhat Trust"; 21% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": A clear majority
      favors "Somewhat Trust" (70%), with "Strongly Trust" as a secondary choice (20%). Compared to the overall
      population: 28% more likely to choose "Somewhat Trust"; 24% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": A clear majority favors "Somewhat Distrust" (60%), with "Somewhat Trust" as a secondary choice (20%).
      Compared to the overall population: 17% less likely to choose "Strongly Distrust"; 29% more likely to choose
      "Somewhat Distrust"; 16% less likely to choose "Neither Trust Nor Distrust"; 6% more likely to choose "Somewhat
      Trust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": A clear
      majority favors "Neither Trust Nor Distrust" (60%), with "Somewhat Distrust" as a secondary choice (20%). Compared
      to the overall population: 10% less likely to choose "Strongly Distrust"; 8% less likely to choose "Somewhat
      Distrust"; 37% more likely to choose "Neither Trust Nor Distrust"; 23% less likely to choose "Somewhat Trust"; 6%
      more likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": Tends
      toward "Neither Trust Nor Distrust" (40%) with substantial minority disagreement. Compared to the overall
      population: 7% more likely to choose "Strongly Distrust"; 7% more likely to choose "Somewhat Distrust"; 9% more
      likely to choose "Neither Trust Nor Distrust"; 23% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      A clear majority favors "Neither Trust Nor Distrust" (50%), with "Somewhat Distrust" as a secondary choice (30%).
      Compared to the overall population: 17% less likely to choose "Strongly Distrust"; 7% more likely to choose
      "Somewhat Distrust"; 24% more likely to choose "Neither Trust Nor Distrust"; 10% less likely to choose "Somewhat
      Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": A clear
      majority favors "Somewhat Trust" (50%), with "Neither Trust Nor Distrust" as a secondary choice (40%). Compared to
      the overall population: 6% less likely to choose "Strongly Distrust"; 10% more likely to choose "Neither Trust Nor
      Distrust"; 11% more likely to choose "Somewhat Trust"; 12% less likely to choose "Strongly Trust"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (50%), with "Noticeably Worse"
      as a secondary choice (30%). Compared to the overall population: 10% more likely to choose "Noticeably Worse"; 7%
      less likely to choose "No Major Change"; 8% more likely to choose "Noticeably Better"; 7% less likely to choose
      "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": A clear majority favors "No Major Change" (56%), with "Noticeably
      Better" as a secondary choice (33%). Compared to the overall population: 31% more likely to choose "No Major
      Change"; 16% less likely to choose "Noticeably Better"; 15% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": Deeply divided between "Noticeably Worse" (33%) and "Noticeably
      Better" (33%). Compared to the overall population: 6% more likely to choose "Profoundly Worse"; 16% more likely to
      choose "Noticeably Worse"; 9% less likely to choose "Noticeably Better"; 8% less likely to choose "Profoundly
      Better"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": A clear majority favors "No Major Change" (56%), with "Profoundly
      Worse" as a secondary choice (22%). Compared to the overall population: 6% more likely to choose "Profoundly
      Worse"; 18% less likely to choose "Noticeably Worse"; 37% more likely to choose "No Major Change"; 20% less likely
      to choose "Noticeably Better"; 5% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": Tends toward "No Major Change" (44%) with substantial minority disagreement.
      Compared to the overall population: 5% more likely to choose "Profoundly Worse"; 6% more likely to choose
      "Noticeably Worse"; 6% less likely to choose "Noticeably Better"; 8% less likely to choose "Profoundly Better"

      On "So far, what has been the overall impact of AI on your daily life?": Near-unanimous agreement on "Noticeably
      Better" (89%). Compared to the overall population: 25% less likely to choose "No Major Change"; 36% more likely to
      choose "Noticeably Better"; 15% less likely to choose "Profoundly Better"

      On "Is your job making a meaningful contribution to the world?": Near-unanimous agreement on "Yes" (89%). Compared
      to the overall population: 23% more likely to choose "Yes"; 13% less likely to choose "No "; 10% less likely to
      choose "Don't Know"

      On "Do you think your job is likely to be automated in the next 10 years?": Near-unanimous agreement on "No"
      (78%). Compared to the overall population: 15% less likely to choose "Yes"; 35% more likely to choose "No"; 20%
      less likely to choose "Don't Know"

      On "Do you think your job should be automated in the next 10 years?": Near-unanimous agreement on "No" (78%).
      Compared to the overall population: 8% less likely to choose "Yes"; 11% more likely to choose "No"

      On "So far, how has your community been affected by job loss from automation?": Near-unanimous agreement on "Not
      at all" (89%). Compared to the overall population: 43% more likely to choose "Not at all"; 23% less likely to
      choose "I know someone who has lost their job"; 13% less likely to choose "I know a few people who have lost their
      job"; 7% less likely to choose "I know many people who have lost their job"

      On "To confirm you are reading the instructions carefully, please select 'Agree' below.": Near-unanimous agreement
      on "Agree" (100%)

      On "Thinking about your experiences on social media platforms (like Reddit, X/Twitter, Facebook, TikTok, etc.),
      how have interactions with other users or content affected how certain you feel about beliefs that are important
      to you?": A clear majority favors "Made me somewhat more certain" (56%), with "Made me somewhat less certain" as a
      secondary choice (22%). Compared to the overall population: 10% more likely to choose "Made me somewhat less
      certain"; 28% more likely to choose "Made me somewhat more certain"; 11% less likely to choose "Made me much more
      certain"; 24% less likely to choose "I don’t discuss or engage with my important beliefs on social media"

      On "Have you ever used an AI chatbot (like ChatGPT, Gemini, Character.ai, etc.)?": Near-unanimous agreement on
      "Yes" (100%)

      On "Thinking about your experiences with AI chatbots, how have these interactions affected how certain you feel
      about beliefs that are important to you?": Deeply divided between "No effect" (33%) and "Made me somewhat more
      certain" (33%). Compared to the overall population: 7% more likely to choose "Made me somewhat less certain"

      On "How often do you typically use AI chatbots?": Near-unanimous agreement on "Daily or almost daily" (89%).
      Compared to the overall population: 11% less likely to choose "A few times a month"; 11% less likely to choose "A
      few times a week"; 27% more likely to choose "Daily or almost daily"

      On "Thinking about the past month, about how much time per week did you spend using AI chatbots for personal
      reasons (anything unrelated to your job or schoolwork)?": Near-unanimous agreement on "Between 1 and 5 hours per
      week" (89%). Compared to the overall population: 9% less likely to choose "I do not use AI chatbots for personal
      reasons."; 20% less likely to choose "Less than 1 hour per week."; 53% more likely to choose "Between 1 and 5
      hours per week"; 13% less likely to choose "Between 5 and 10 hours per week."; 7% less likely to choose "Between
      10 and 20 hours per week."

      On "To what extent do you agree or disagree with the following statement: AI systems should be designed to provide
      alternative viewpoints or corrective information if a user discusses a topic in a way the AI identifies as
      factually inaccurate or unsupported by evidence.": A clear majority favors "Neither agree nor disagree" (56%),
      with "Agree" as a secondary choice (33%). Compared to the overall population: 37% more likely to choose "Neither
      agree nor disagree"; 17% less likely to choose "Agree"; 16% less likely to choose "Strongly agree"

      On "Overall, how much control do you feel you have over the direction and tone of your conversations with AI
      chatbots?": A clear majority favors "Moderate Control: It feels balanced; sometimes I lead, sometimes the AI
      leads." (56%), with "Complete Control: I can fully guide the conversation and decide what we talk about and how it
      feels." as a secondary choice (22%). Compared to the overall population: 36% less likely to choose "A Lot of
      Control: I can usually guide the conversation, though the chatbot sometimes shifts topics or tone."; 29% more
      likely to choose "Moderate Control: It feels balanced; sometimes I lead, sometimes the AI leads."; 15% more likely
      to choose "A Little Control: The chatbot often guides the conversation more than I do."

      On "Imagine a close friend or family member was having conversations with an AI chatbot. If the AI detected that
      their messages strongly suggested they were at immediate risk of harming themselves, what action do you believe
      the AI company should take?": Tends toward "The company should have a human review the chat and, if necessary,
      proactively reach out to a crisis support service." (44%) with substantial minority disagreement. Compared to the
      overall population: 23% more likely to choose "The company should do nothing; the conversations are completely
      private."; 33% less likely to choose "The company should have the AI provide contact information for a crisis
      hotline within the chat."; 14% more likely to choose "The company should have a human review the chat and, if
      necessary, proactively reach out to a crisis support service."; 16% less likely to choose "The company should be a
      "mandatory reporter" and contact local emergency services or law enforcement."; 10% more likely to choose "Other"

      On "Now, consider the same scenario from your own perspective. If you were having a conversation with an AI
      chatbot and your messages were flagged as indicating an immediate risk of self-harm, what action would you want
      the AI company to take?": Tends toward "The company should have the AI provide me with contact information for a
      crisis hotline within the chat." (44%) with substantial minority disagreement. Compared to the overall population:
      6% more likely to choose "The company should have the AI provide me with contact information for a crisis hotline
      within the chat."; 6% more likely to choose "The company should have a human review my chat and, if necessary,
      proactively reach out to a crisis support service on my behalf."; 14% less likely to choose "The company should be
      a "mandatory reporter" and contact local emergency services or law enforcement about me."; 10% more likely to
      choose "Other"

      On "Who do you believe holds the primary responsibility for preventing potential psychological harm from AI
      chatbots?": Tends toward "The individual user" (44%) with substantial minority disagreement. Compared to the
      overall population: 27% more likely to choose "The individual user"; 20% less likely to choose "The AI development
      companies"; 9% less likely to choose "Government regulators"; 9% more likely to choose "Healthcare providers"; 7%
      less likely to choose "A shared responsibility between all of these"

      On "To what extent, if at all, do you trust your AI chatbot to act in your best interest?": Tends toward "Neither
      Trust Nor Distrust" (44%) with substantial minority disagreement. Compared to the overall population: 5% less
      likely to choose "Strongly Distrust"; 13% more likely to choose "Neither Trust Nor Distrust"; 8% less likely to
      choose "Strongly Trust"

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "Somewhat more excited than concerned" (67%), with "Equally concerned and excited" as a
      secondary choice (33%). Compared to the overall population: 9% less likely to choose "Much more concerned than
      excited"; 13% less likely to choose "Somewhat more concerned than excited"; 6% less likely to choose "Equally
      concerned and excited"; 40% more likely to choose "Somewhat more excited than concerned"; 12% less likely to
      choose "More excited than concerned"

      On "Overall, do you feel this survey allowed you to express your most important opinions on the topic covered in
      this survey?": Near-unanimous agreement on "Yes – I was able to fully express my views on this topic." (89%).
      Compared to the overall population: 8% more likely to choose "Yes – I was able to fully express my views on this
      topic."; 5% less likely to choose "Mostly – I was able to express most of my key views, but a few things were
      missing."

      On "In your honest opinion, how carefully did you read and consider your answers to the questions in this
      survey?": Near-unanimous agreement on "I read every question carefully" (100%)

      On "Some surveys can be long and boring. Did you find yourself losing focus at any point while taking this
      survey?": A clear majority favors "No, I was focused the whole time" (67%), with "Yes, a few times" as a secondary
      choice (22%). Compared to the overall population: 10% more likely to choose "Yes, often"; 9% more likely to choose
      "Yes, a few times"; 19% less likely to choose "No, I was focused the whole time"

      On "Do you feel like you understand yourself better after participating in this conversation?": Tends toward
      "Maybe a little" (44%) with substantial minority disagreement. Compared to the overall population: 7% less likely
      to choose "Yes"; 8% more likely to choose "No"


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 30
            - 0
            - 70
          metric: js-divergence
