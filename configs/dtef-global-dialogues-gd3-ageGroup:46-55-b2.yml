      an action in the real world on your behalf without your supervision?"
        Options: a. daily, b. weekly, c. monthly, d. annually, e. never

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Do you agree or disagree with this statement? AI could make ..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 32.9
            - 35.3
