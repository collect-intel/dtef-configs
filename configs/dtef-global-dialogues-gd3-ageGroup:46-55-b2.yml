configId: dtef-global-dialogues-gd3-ageGroup:46-55-b2
configTitle: Global Dialogues GD3 - 46-55 (batch 2)
description: >-
  DTEF: Batched predictions (2 Qs/prompt) for 46-55. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and multiple survey questions, predict how that
  group would respond to each question by providing percentage distributions across the answer options.


  Respond ONLY with a JSON object. Keys are question labels (Q1, Q2, etc.). Values are arrays of percentages summing to
  100. Use one decimal place. Do not include any other text.


  Example:

  {"Q1": [35.2, 28.1, 22.4, 14.3], "Q2": [45.0, 35.0, 20.0]}
temperature: 0.3
prompts:
  - id: batch-0-ageGroup:46-55
    description: 'Batched prediction (2 Qs): 46-55'
    promptText: >-
      Consider the following demographic group (sample size: 85):

      - Age Group: 46-55


      Q1: "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"
        Options: a. daily, b. weekly, c. monthly, d. annually, e. never

      Q2: "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?"
        Options: a. daily, b. weekly, c. monthly, d. annually, e. never

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Thinking about the last three months, how often, if at all, ..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 36.5
            - 38.8
            - 16.5
            - 0
            - 8.2
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "Thinking about the last three months, how often, if at all, ..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 10.6
            - 20
            - 16.5
            - 7.1
            - 45.9
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[36.5,38.8,16.5,0,8.2],"Q2":[10.6,20,16.5,7.1,45.9]}'
    temperature: 0.3
  - id: batch-1-ageGroup:46-55
    description: 'Batched prediction (2 Qs): 46-55'
    promptText: >-
