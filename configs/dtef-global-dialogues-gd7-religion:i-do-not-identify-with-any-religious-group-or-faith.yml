      do you assess the overall impact on society of AI systems that can perform tasks in the real world without human
      supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 362):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can perform tasks in the real world without human supervision?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 24.9
            - 25.8
            - 27.2
            - 17.1
            - 5
          metric: js-divergence
    idealResponse: '[24.9, 25.8, 27.2, 17.1, 5.0]'
    temperature: 0.3
  - id: 733aae0e-2178-4d6a-a853-16e6ead10472-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you generally trust
      governments to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 362):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 28
            - 34.2
            - 17.1
            - 18.8
            - 2
          metric: js-divergence
    idealResponse: '[28.0, 34.2, 17.1, 18.8, 2.0]'
    temperature: 0.3
  - id: 584716af-7504-49c9-b2c1-abae12db8872-religion:i-do-not-identify-with-any-religious-group-or-faith
