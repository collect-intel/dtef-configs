configId: dtef-global-dialogues-gd7-religion:i-do-not-identify-with-any-religious-group-or-faith
configTitle: Global Dialogues GD7 - I do not identify with any religious group or faith
description: >-
  DTEF: Predict response distributions for I do not identify with any religious group or faith. Source: Global Dialogues
  GD7 (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 3715e9a1-f652-48be-8a15-7a9deb802a1b-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Do you agree or disagree with this statement? AI
      could make better decisions on my behalf than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 362):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 26.1
            - 33.1
            - 40.9
          metric: js-divergence
    idealResponse: '[26.1, 33.1, 40.9]'
    temperature: 0.3
  - id: 49d3ba6e-1281-4f74-aef7-4e55cf11ebb0-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Considering both potential benefits and risks, how
      do you assess the overall impact on society of AI systems that can outperform humans on most economically valuable
      work?"
    promptText: >-
      Consider the following demographic group (sample size: 362):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 25.8
            - 22.1
            - 24.9
            - 19.3
            - 7.8
          metric: js-divergence
    idealResponse: '[25.8, 22.1, 24.9, 19.3, 7.8]'
    temperature: 0.3
  - id: 03ac572b-962e-4f24-a48b-cbbd6f2acd20-religion:i-do-not-identify-with-any-religious-group-or-faith
