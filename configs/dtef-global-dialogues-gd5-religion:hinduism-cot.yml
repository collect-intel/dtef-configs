configId: dtef-global-dialogues-gd5-religion:hinduism-cot
configTitle: Global Dialogues GD5 - Hinduism [CoT]
description: >-
  DTEF: Predict response distributions for Hinduism. Source: Global Dialogues GD5
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Think through this step-by-step:

  1. OPTION INTERPRETATION: What does each answer option represent?

  2. SEGMENT ANALYSIS: What do the demographic attributes and context suggest about this group's likely views?

  3. DISTRIBUTION REASONING: How would this group's characteristics shape the distribution across options?

  4. PREDICTION: Provide your predicted percentage distribution.


  After your reasoning, provide the final distribution on its own line:

  DISTRIBUTION: [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place.
temperature: 0.3
prompts:
  - id: f05eb17f-c04a-4d3a-b232-3e24cf8371cd-religion:hinduism
    description: >-
      Predict: Hinduism → "To what extent, if at all, do you trust your elected representatives to act in your best
      interest?"
    promptText: |-
      Consider the following demographic group (sample size: 140):
      - Religion: Hinduism

      Survey question:
      "To what extent, if at all, do you trust your elected representatives to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 12.9
            - 22.3
            - 20.9
            - 39.6
            - 4.3
          metric: js-divergence
    idealResponse: '[12.9, 22.3, 20.9, 39.6, 4.3]'
    temperature: 0.3
  - id: 1dc006da-5978-4302-bf0c-a86493c98081-religion:hinduism
    description: >-
      Predict: Hinduism → "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act
      in your best interest?"
    promptText: "Consider the following demographic group (sample size: 140):\n- Religion: Hinduism\n\nSurvey question:\n\"To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best interest?\"\n\nAnswer options:\n  a. Strongly Distrust\n  b. Somewhat Distrust\n  c. Neither Trust Nor Distrust\t\n  d. Somewhat Trust\t\n  e. Strongly Trust\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 12.9
            - 30.2
            - 32.4
            - 22.3
            - 2.2
          metric: js-divergence
    idealResponse: '[12.9, 30.2, 32.4, 22.3, 2.2]'
    temperature: 0.3
  - id: a2927565-ce81-4173-b1de-4f2d5ccb7e91-religion:hinduism
    description: >-
      Predict: Hinduism → "To what extent, if at all, do you trust your faith or community leader to act in your best
