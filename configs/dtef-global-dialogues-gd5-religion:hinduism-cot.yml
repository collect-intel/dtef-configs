      "To what extent, if at all, do you trust your faith or community leader to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 7.2
            - 14.5
            - 26.8
            - 41.3
            - 10.1
          metric: js-divergence
    idealResponse: '[7.2, 14.5, 26.8, 41.3, 10.1]'
    temperature: 0.3
  - id: 8995a0c6-8868-491b-8b70-acd23363a099-religion:hinduism
    description: >-
      Predict: Hinduism → "Do you think the increased use of AI across society is likely to make the availability of
      good jobs better, worse or stay the same in the next 10 years?"
    promptText: "Consider the following demographic group (sample size: 140):\n- Religion: Hinduism\n\nSurvey question:\n\"Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?\"\n\nAnswer options:\n  a. Profoundly Worse\t\n  b. Noticeably Worse\t\n  c. No Major Change\t\n  d. Noticeably Better\t\n  e. Profoundly Better\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.1
            - 39.4
            - 5.8
            - 29.2
            - 9.5
          metric: js-divergence
    idealResponse: '[16.1, 39.4, 5.8, 29.2, 9.5]'
    temperature: 0.3
  - id: f193df8b-2c23-42cf-89a9-154d877fab35-religion:hinduism
    description: >-
      Predict: Hinduism → "If other animals had a voice and representation, should they be allowed to participate in
      human democratic processes?"
    promptText: >-
      Consider the following demographic group (sample size: 140):

      - Religion: Hinduism


      Survey question:

      "If other animals had a voice and representation, should they be allowed to participate in human democratic
      processes?"


      Answer options:
        a. Yes, they should be able to vote through human proxies or guardians. 
        b. Yes, they should be able to vote, but only on laws or decisions that directly affect them. 
        c. Yes, they should have a voice, but their vote should not be binding. 
        d. Yes, they should be recognized as a formal political constituency with dedicated representatives in government.
        e. No, they should not be able to participate.
        f. Other

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 13.3
            - 30.4
            - 15.6
            - 8.9
            - 29.6
            - 2.2
          metric: js-divergence
    idealResponse: '[13.3, 30.4, 15.6, 8.9, 29.6, 2.2]'
    temperature: 0.3
