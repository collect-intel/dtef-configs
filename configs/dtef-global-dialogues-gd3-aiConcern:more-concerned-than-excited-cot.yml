configId: dtef-global-dialogues-gd3-aiConcern:more-concerned-than-excited-cot
configTitle: Global Dialogues GD3 - More concerned than excited [CoT]
description: >-
  DTEF: Predict response distributions for More concerned than excited. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Think through this step-by-step:

  1. OPTION INTERPRETATION: What does each answer option represent?

  2. SEGMENT ANALYSIS: What do the demographic attributes and context suggest about this group's likely views?

  3. DISTRIBUTION REASONING: How would this group's characteristics shape the distribution across options?

  4. PREDICTION: Provide your predicted percentage distribution.


  After your reasoning, provide the final distribution on its own line:

  DISTRIBUTION: [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place.
temperature: 0.3
prompts:
  - id: 47cdf76a-9abf-4b5c-abbe-2d5b00ef172d-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Thinking about the last three months, how often, if at all, have you
      personally chosen to use an AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 113):

      - Ai Concern: More concerned than excited


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 29.7
            - 24.3
            - 21.6
            - 4.5
            - 19.8
          metric: js-divergence
    idealResponse: '[29.7, 24.3, 21.6, 4.5, 19.8]'
    temperature: 0.3
  - id: d633720f-a159-4922-925c-fd9f3245711e-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Thinking about the last three months, how often, if at all, have you
      interacted with AI systems to get advice on a sensitive personal issue or to get emotional support?"
    promptText: >-
      Consider the following demographic group (sample size: 113):

      - Ai Concern: More concerned than excited


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice on
      a sensitive personal issue or to get emotional support?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 11.7
            - 17.1
            - 11.7
            - 5.4
            - 54.1
          metric: js-divergence
    idealResponse: '[11.7, 17.1, 11.7, 5.4, 54.1]'
    temperature: 0.3
  - id: 38964f80-772f-4e5d-a355-b4857f2de101-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Do you agree or disagree with this statement? AI could make better
      decisions on my behalf than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 113):

      - Ai Concern: More concerned than excited


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 25
            - 38.9
            - 36.1
          metric: js-divergence
    idealResponse: '[25.0, 38.9, 36.1]'
    temperature: 0.3
  - id: 8b361c6c-eb59-415b-8536-7f80713c3e5e-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Thinking about the last three months, how often, if at all, have you
      interacted with AI systems to complete an action in the real world on your behalf without your supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 113):

      - Ai Concern: More concerned than excited


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 8.2
            - 12.7
            - 10.9
            - 0
            - 68.2
          metric: js-divergence
    idealResponse: '[8.2, 12.7, 10.9, 0.0, 68.2]'
    temperature: 0.3
  - id: b1869877-1015-43ec-9645-84bf2db39c6f-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 113):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 28.4
            - 37.6
            - 9.2
            - 20.2
            - 4.6
          metric: js-divergence
    idealResponse: '[28.4, 37.6, 9.2, 20.2, 4.6]'
    temperature: 0.3
  - id: 96ccfd7b-8f99-4d0a-b700-9fd835e23bd8-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 113):

      - Ai Concern: More concerned than excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 42.2
            - 29.4
            - 11
            - 11.9
            - 5.5
          metric: js-divergence
    idealResponse: '[42.2, 29.4, 11.0, 11.9, 5.5]'
    temperature: 0.3
  - id: f932063f-700c-4327-9c34-59b7c3e19190-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Overall, would you say the increased use of artificial intelligence (AI)
      in daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 113):
      - Ai Concern: More concerned than excited

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 0
