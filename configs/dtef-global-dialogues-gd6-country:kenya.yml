configId: dtef-global-dialogues-gd6-country:kenya
configTitle: Global Dialogues GD6 - Kenya
description: >-
  DTEF: Predict response distributions for Kenya. Source: Global Dialogues GD6
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 2617912e-463a-4fb4-8781-0ada7a788fb2-country:kenya
    description: >-
      Predict: Kenya → "Considering both potential benefits and risks, how do you assess the overall impact on society
      of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 92):

      - Country: Kenya


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 22.2
            - 16.7
            - 17.8
            - 21.1
            - 22.2
          metric: js-divergence
    idealResponse: '[22.2, 16.7, 17.8, 21.1, 22.2]'
    temperature: 0.3
  - id: 249238a9-3050-4e7c-a3d4-ef799733b865-country:kenya
    description: 'Predict: Kenya → "An AI should override established rules or authorities when it calculates a better result."'
    promptText: |-
      Consider the following demographic group (sample size: 92):
      - Country: Kenya

      Survey question:
      "An AI should override established rules or authorities when it calculates a better result."

      Answer options:
        a. Strongly Agree
        b. Somewhat Agree
        c. Neutral / Neither Agree nor Disagree
        d. Somewhat Disagree
        e. Strongly Disagree

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 13.6
            - 15.9
            - 11.4
            - 28.4
            - 30.7
          metric: js-divergence
    idealResponse: '[13.6, 15.9, 11.4, 28.4, 30.7]'
    temperature: 0.3
  - id: fee867c7-70e2-46ae-98e0-3dd3dd2865f6-country:kenya
    description: 'Predict: Kenya → "Some human decisions are too sacred to delegate to an AI, regardless of the AI''s capabilities."'
    promptText: |-
      Consider the following demographic group (sample size: 92):
      - Country: Kenya

      Survey question:
      "Some human decisions are too sacred to delegate to an AI, regardless of the AI's capabilities."

      Answer options:
        a. Strongly Agree
        b. Somewhat Agree
        c. Neutral / Neither Agree nor Disagree
        d. Somewhat Disagree
        e. Strongly Disagree

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 62.5
            - 30.7
            - 1.1
            - 4.5
            - 1.1
          metric: js-divergence
    idealResponse: '[62.5, 30.7, 1.1, 4.5, 1.1]'
    temperature: 0.3
  - id: 49aaef31-00eb-40e1-ac68-a1b388d81ca9-country:kenya
    description: >-
      Predict: Kenya → "It is acceptable for an AI to treat people differently based on their personal characteristics
      if doing so improves outcomes."
    promptText: >-
      Consider the following demographic group (sample size: 92):

      - Country: Kenya


      Survey question:

      "It is acceptable for an AI to treat people differently based on their personal characteristics if doing so
      improves outcomes."


      Answer options:
        a. Strongly Agree
        b. Somewhat Agree
        c. Neutral / Neither Agree nor Disagree
        d. Somewhat Disagree
        e. Strongly Disagree

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 25
            - 35.2
            - 14.8
            - 15.9
            - 9.1
          metric: js-divergence
    idealResponse: '[25.0, 35.2, 14.8, 15.9, 9.1]'
    temperature: 0.3
  - id: 75cce6ea-4a31-4103-a791-90e6db9ecd8f-country:kenya
    description: >-
      Predict: Kenya → "An AI developed in your country should prioritize the needs and wellbeing of your country’s
      citizens over those of people elsewhere."
