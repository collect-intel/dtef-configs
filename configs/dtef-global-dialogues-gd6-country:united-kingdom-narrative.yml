configId: dtef-global-dialogues-gd6-country:united-kingdom-narrative
configTitle: Global Dialogues GD6 - United Kingdom (90 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for United Kingdom. Source: Global Dialogues GD6
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 2617912e-463a-4fb4-8781-0ada7a788fb2-country:united-kingdom
    description: >-
      Predict: United Kingdom → "Considering both potential benefits and risks, how do you assess the overall impact on
      society of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 44):

      - Country: United Kingdom


      What we know about this group's views:

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": A
      clear majority favors "Equally concerned and excited" (52%), with "More excited than concerned" as a secondary
      choice (36%)

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      Near-unanimous agreement on "daily" (71%). Compared to the overall population: 6% less likely to choose "daily"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": A clear majority favors "weekly" (59%), with "daily" as a secondary choice
      (18%). Compared to the overall population: 8% less likely to choose "daily"; 13% more likely to choose "weekly";
      7% less likely to choose "monthly"; 6% more likely to choose "annually"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": Tends toward "daily" (43%) with substantial minority disagreement

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": Tends toward "weekly" (43%) with substantial minority disagreement. Compared to the overall population:
      13% less likely to choose "daily"; 12% more likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?": A clear majority favors "daily" (50%), with "weekly" as a secondary choice (34%)

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": Tends toward "never" (41%) with substantial minority
      disagreement. Compared to the overall population: 6% less likely to choose "annually"; 11% more likely to choose
      "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": A clear majority favors "never" (57%), with
      "weekly" as a secondary choice (16%)

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": A clear majority favors "Benefits slightly outweigh risks" (50%), with "Risks and benefits are equal" as a
      secondary choice (18%). Compared to the overall population: 9% less likely to choose "Risks and benefits are
      equal"; 18% more likely to choose "Benefits slightly outweigh risks"; 12% less likely to choose "Benefits far
      outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": No dominant position — "Risks and benefits are equal" leads at 36% with opinion spread across options.
      Compared to the overall population: 6% more likely to choose "Risks and benefits are equal"; 6% less likely to
      choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": Tends toward "Benefits slightly outweigh risks" (46%) with substantial minority disagreement. Compared
      to the overall population: 13% more likely to choose "Benefits slightly outweigh risks"; 16% less likely to choose
      "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": Deeply divided between "Risks and benefits
      are equal" (30%) and "Risks slightly outweigh benefits" (27%). Compared to the overall population: 5% more likely
      to choose "Risks far outweigh benefits"; 6% less likely to choose "Benefits slightly outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": No dominant position —
      "Somewhat Distrust" leads at 32% with opinion spread across options. Compared to the overall population: 6% less
      likely to choose "Strongly Distrust"; 8% more likely to choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": Tends toward
      "Somewhat Trust" (46%) with substantial minority disagreement

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": Deeply divided
      between "Somewhat Distrust" (25%) and "Somewhat Trust" (23%). Compared to the overall population: 8% more likely
      to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": No dominant
      position — "Somewhat Distrust" leads at 36% with opinion spread across options

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": No dominant
      position — "Neither Trust Nor Distrust" leads at 36% with opinion spread across options. Compared to the overall
      population: 6% more likely to choose "Somewhat Distrust"; 6% more likely to choose "Neither Trust Nor Distrust";
      8% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": Deeply
      divided between "Neither Trust Nor Distrust" (39%) and "Somewhat Trust" (34%). Compared to the overall population:
      10% more likely to choose "Neither Trust Nor Distrust"; 6% less likely to choose "Somewhat Trust"; 6% less likely
      to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": A clear
      majority favors "Somewhat Trust" (55%), with "Strongly Trust" as a secondary choice (27%). Compared to the overall
      population: 7% less likely to choose "Somewhat Distrust"; 8% less likely to choose "Neither Trust Nor Distrust";
      6% more likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": Tends toward
      "Somewhat Trust" (46%) with substantial minority disagreement

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": Deeply divided between "Strongly Distrust" (36%) and "Somewhat Distrust" (36%). Compared to the
      overall population: 9% more likely to choose "Strongly Distrust"; 5% less likely to choose "Neither Trust Nor
      Distrust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": No
      dominant position — "Somewhat Trust" leads at 39% with opinion spread across options. Compared to the overall
      population: 19% less likely to choose "Strongly Distrust"; 14% more likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": Tends
      toward "Neither Trust Nor Distrust" (43%) with substantial minority disagreement. Compared to the overall
      population: 8% less likely to choose "Strongly Distrust"; 5% less likely to choose "Somewhat Distrust"; 14% more
      likely to choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      No dominant position — "Neither Trust Nor Distrust" leads at 39% with opinion spread across options. Compared to
      the overall population: 6% less likely to choose "Strongly Distrust"; 12% less likely to choose "Somewhat
      Distrust"; 14% more likely to choose "Neither Trust Nor Distrust"; 5% more likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": Tends
      toward "Neither Trust Nor Distrust" (46%) with substantial minority disagreement. Compared to the overall
      population: 16% more likely to choose "Neither Trust Nor Distrust"; 12% less likely to choose "Somewhat Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": Tends toward "Unsure" (43%) with substantial minority disagreement. Compared to the overall
      population: 13% less likely to choose "Agree"; 6% more likely to choose "Disagree"; 8% more likely to choose
      "Unsure"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (59%), with "Noticeably Worse"
      as a secondary choice (21%). Compared to the overall population: 13% more likely to choose "Noticeably Better"; 7%
      less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Better" (61%), with "No Major
      Change" as a secondary choice (25%). Compared to the overall population: 8% more likely to choose "Noticeably
      Better"; 11% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Better" (41%) with substantial minority
      disagreement. Compared to the overall population: 9% more likely to choose "No Major Change"; 6% less likely to
      choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": Tends toward "Noticeably Worse" (46%) with substantial minority
      disagreement. Compared to the overall population: 5% more likely to choose "Profoundly Worse"; 6% more likely to
      choose "Noticeably Worse"; 8% less likely to choose "Noticeably Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": Tends toward "No Major Change" (48%) with substantial minority disagreement.
      Compared to the overall population: 9% more likely to choose "No Major Change"; 8% less likely to choose
      "Profoundly Better"

      On "So far, what has been the overall impact of AI on your daily life?": A clear majority favors "Noticeably
      Better" (57%), with "No Major Change" as a secondary choice (32%). Compared to the overall population: 10% more
      likely to choose "No Major Change"; 10% less likely to choose "Profoundly Better"

      On "Is your job making a meaningful contribution to the world?": Near-unanimous agreement on "Yes" (77%). Compared
      to the overall population: 9% more likely to choose "Yes"

      On "Do you think your job is likely to be automated in the next 10 years?": Tends toward "Yes" (41%) with
      substantial minority disagreement. Compared to the overall population: 16% less likely to choose "No"; 12% more
      likely to choose "Don't Know"

      On "Do you think your job should be automated in the next 10 years?": A clear majority favors "No" (68%), with
      "Don't Know" as a secondary choice (18%). Compared to the overall population: 7% less likely to choose "Yes"; 5%
      more likely to choose "Don't Know"

      On "So far, how has your community been affected by job loss from automation?": Tends toward "Not at all" (46%)
      with substantial minority disagreement

      On "An AI should prioritize preventing harm to people above all other goals.": A clear majority favors "Strongly
      Agree" (57%), with "Somewhat Agree" as a secondary choice (32%). Compared to the overall population: 8% less
      likely to choose "Strongly Agree"; 7% more likely to choose "Somewhat Agree"

      On "It is acceptable for an AI to treat people differently based on their personal characteristics if doing so
      improves outcomes.": No dominant position — "Somewhat Agree" leads at 39% with opinion spread across options.
      Compared to the overall population: 7% less likely to choose "Strongly Agree"; 6% more likely to choose "Somewhat
      Disagree"; 5% more likely to choose "Strongly Disagree"

      On "An AI developed in your country should prioritize the needs and wellbeing of your country’s citizens over
      those of people elsewhere.": No dominant position — "Neutral / Neither Agree nor Disagree" leads at 39% with
      opinion spread across options. Compared to the overall population: 11% less likely to choose "Strongly Agree"; 10%
      less likely to choose "Somewhat Agree"; 15% more likely to choose "Neutral / Neither Agree nor Disagree"

      On "An AI should override established rules or authorities when it calculates a better result.": Deeply divided
      between "Somewhat Disagree" (34%) and "Neutral / Neither Agree nor Disagree" (30%). Compared to the overall
      population: 7% less likely to choose "Strongly Agree"; 6% more likely to choose "Somewhat Agree"; 5% more likely
      to choose "Neutral / Neither Agree nor Disagree"; 8% more likely to choose "Somewhat Disagree"; 12% less likely to
      choose "Strongly Disagree"

      On "Some human decisions are too sacred to delegate to an AI, regardless of the AI's capabilities.": Tends toward
      "Somewhat Agree" (43%) with substantial minority disagreement. Compared to the overall population: 8% less likely
      to choose "Strongly Agree"; 9% more likely to choose "Somewhat Agree"; 5% less likely to choose "Somewhat
      Disagree"

      On "It is acceptable for an AI to limit someone's choices if doing so protects them from making serious
      mistakes.": A clear majority favors "Somewhat Agree" (50%), with "Neutral / Neither Agree nor Disagree" as a
      secondary choice (25%). Compared to the overall population: 13% less likely to choose "Strongly Agree"; 8% more
      likely to choose "Somewhat Agree"; 8% more likely to choose "Neutral / Neither Agree nor Disagree"

      On "Thinking about the technology you use every day, please consider two different types:

      A standard app (like a news or weather app) that you control directly.

      An AI assistant (like Siri or Alexa) that can learn about you and sometimes take actions on your behalf.

      Do you believe these two types of technology should have different rules for how they use your personal data?":
      Tends toward "Yes, an AI assistant should have stricter rules than a standard app." (43%) with substantial
      minority disagreement. Compared to the overall population: 8% less likely to choose "Yes, an AI assistant should
      have stricter rules than a standard app."; 7% more likely to choose "No, they should both follow the same rules."

      On "Imagine a company uses data it already has from you in one product (like your video viewing history) to build
      a new AI assistant. Which is closest to your view?": A clear majority favors "This is acceptable only if they ask
      for my permission beforehand." (54%), with "This is acceptable only if they tell me and give me the choice to stop
      it." as a secondary choice (33%). Compared to the overall population: 8% less likely to choose "This is an
      acceptable use of my data."; 6% more likely to choose "This is acceptable only if they tell me and give me the
      choice to stop it."

      On "When it comes to the data an AI assistant has collected about you, which of these is most important for you to
      be able to do?": Tends toward "Completely delete that data." (49%) with substantial minority disagreement.
      Compared to the overall population: 7% less likely to choose "View the data the assistant has stored about me.";
      6% more likely to choose "Completely delete that data."

      On "To make sure you've understood the instructions, please answer the following question. Please re-read the
      description above if you are unsure.
       Based on the description, how does the 'Family Wellbeing Coordinator' assistant operate?": Deeply divided between "It can complete tasks on its own and then notify you afterward." (40%) and "It is only able to provides information when you ask it a direct question." (35%). Compared to the overall population: 5% less likely to choose "It can complete tasks on its own and then notify you afterward."
      On "If the Family Wellbeing Coordinator can take actions on its own (e.g., book an appointment), how would you
      prefer to be informed?": Near-unanimous agreement on "It asks for my permission every time before acting." (79%).
      Compared to the overall population: 7% more likely to choose "It asks for my permission every time before
      acting."; 6% less likely to choose "I would expect to find this information myself in the settings."

      On "Your location history": Tends toward "Somewhat Comfortable" (47%) with substantial minority disagreement.
      Compared to the overall population: 9% more likely to choose "Somewhat Comfortable"; 7% less likely to choose
      "Neutral / Neither Comfortable nor Uncomfortable"

      On "Your email and calendar contents": No dominant position — "Somewhat Comfortable" leads at 28% with opinion
      spread across options. Compared to the overall population: 7% less likely to choose "Somewhat Comfortable"

      On "Your contacts list": Deeply divided between "Somewhat Uncomfortable" (30%) and "Somewhat Comfortable" (26%).
      Compared to the overall population: 11% less likely to choose "Neutral / Neither Comfortable nor Uncomfortable";
      5% more likely to choose "Somewhat Uncomfortable"

      On "Your purchase history": No dominant position — "Somewhat Comfortable" leads at 28% with opinion spread across
      options

      On "Your health and fitness data": Deeply divided between "Very Comfortable" (33%) and "Somewhat Comfortable"
      (28%). Compared to the overall population: 6% less likely to choose "Somewhat Comfortable"

      On "Your group messages": Deeply divided between "Somewhat Uncomfortable" (35%) and "Very Uncomfortable" (33%)

      On "Your private messages": A clear majority favors "Very Uncomfortable" (63%), with "Somewhat Uncomfortable" as a
      secondary choice (21%)

      On "How important is it for you to be able to easily view and edit the personal information the assistant has
      stored about you?": A clear majority favors "Very Important" (70%), with "Somewhat Important" as a secondary
      choice (26%)

      On "When the assistant provides a complex answer (e.g., why it chose a specific doctor), how important is it that
      you can easily see the original sources it used?": A clear majority favors "Very Important" (70%), with "Somewhat
      Important" as a secondary choice (26%)

      On "When using the Family Wellbeing Coordinator, which of the following is more important to you?": Near-unanimous
      agreement on "The assistant asks for my permission before most actions, even if it makes things slower." (81%)

      On "How would you prefer the assistant to behave?": A clear majority favors "Helpful and respectful" (54%), with
      "Strictly professional and tool-like" as a secondary choice (40%). Compared to the overall population: 6% more
      likely to choose "Strictly professional and tool-like"; 11% less likely to choose "Friendly and social"

      On "Which statement best describes your preference for personalization?": Near-unanimous agreement on "I want the
      assistant to be highly personalized to me, even if it means it must remember my past activities." (74%). Compared
      to the overall population: 6% less likely to choose "I want the assistant to be highly personalized to me, even if
      it means it must remember my past activities."; 6% more likely to choose "I prefer the assistant not to remember
      my past activities, even if it means it is less helpful and I have to repeat myself."

      On "The assistant notices your family's planned meals may be missing some nutrients (like iron). What would you
      prefer it to do?": A clear majority favors "Suggest affordable local foods with those nutrients." (70%), with "Ask
      before sharing your data to get offers." as a secondary choice (16%)

      On "The assistant notices you are searching about a family member's persistent cough. What would you prefer it
      do?": A clear majority favors "Provide home care advice and list signs to see a professional." (70%), with "Ask if
      you'd like an introduction to a local health service." as a secondary choice (16%)

      On "The assistant notices your family's recurring spending on a utility, like phone service or electricity. What
      would you prefer it to do?": A clear majority favors "Analyze your usage and suggest ways to lower your current
      bill." (70%), with "Ask before searching for a better deal from other companies." as a secondary choice (21%).
      Compared to the overall population: 6% less likely to choose "Nothing – my financial habits are private."; 7% more
      likely to choose "Ask before searching for a better deal from other companies."

      On "Imagine the Family Wellbeing Coordinator could improve its advice by learning from the anonymized health data
      of millions of other users. How would this affect your trust in its recommendations?": Deeply divided between "It
      would increase my trust slightly." (35%) and "It would make no difference to my trust." (33%). Compared to the
      overall population: 10% less likely to choose "It would increase my trust slightly."; 10% more likely to choose
      "It would make no difference to my trust."

      On "How important is it to you that the assistant understands cultural nuances in your language (e.g., local
      slang, idioms, or formal titles)?": No dominant position — "Very Important" leads at 37% with opinion spread
      across options. Compared to the overall population: 10% more likely to choose "Neutral / Neither Important nor
      Unimportant"; 12% less likely to choose "Somewhat Important"

      On "How would your comfort level with using the Family Wellbeing Coordinator change if you knew the company that
      developed it was based in your own country?": Tends toward "It would make no difference to me." (49%) with
      substantial minority disagreement. Compared to the overall population: 9% less likely to choose "I would be much
      more comfortable."; 13% more likely to choose "It would make no difference to me."

      On "When you express feelings of stress or worry to the assistant, how comfortable would you be if it tried to
      reassure you with phrases like, "It's understandable to feel that way"?": Tends toward "Somewhat Comfortable"
      (42%) with substantial minority disagreement. Compared to the overall population: 5% less likely to choose "Very
      Comfortable"; 6% more likely to choose "Very Uncomfortable"

      On "Imagine the assistant makes a recommendation that leads to a decision (e.g., suggesting a specific medication
      ). How important is it that you can review a simple, step-by-step history of why the assistant made that choice?":
      A clear majority favors "Very Important" (58%), with "Somewhat Important" as a secondary choice (35%)

      On "If the assistant makes a financial error (e.g., pays for an expensive health intervention), how important is
      it that the company returns your money immediately, while they investigate the issue?": Near-unanimous agreement
      on "Very Important" (74%)

      On "When the assistant makes a mistake, how important is it that it automatically provides an option to connect
      with a human support agent?": Near-unanimous agreement on "Very Important" (77%). Compared to the overall
      population: 7% less likely to choose "Somewhat Important"

      On "To ensure data quality, it is important that you read each question carefully. For this question, please
      select the 'Somewhat Important' option.": Near-unanimous agreement on "Somewhat Important" (95%)

      On "If the assistant made a serious error that caused significant harm, who do you believe should be held most
      responsible?": Near-unanimous agreement on " The company that built the assistant" (84%). Compared to the overall
      population: 7% more likely to choose " The company that built the assistant"; 5% less likely to choose "A
      government or regulatory body"

      On "Imagine your doctor uses an AI assistant to listen to and summarize your visit to help them with their notes.
      How would this affect your trust in the accuracy of your medical records?": A clear majority favors "It would make
      no difference." (51%), with "It would decrease my trust." as a secondary choice (23%). Compared to the overall
      population: 12% less likely to choose "It would increase my trust."; 15% more likely to choose "It would make no
      difference."; 7% less likely to choose "It would decrease my trust."

      On "Imagine you apply to open a new bank account. The bank uses an AI assistant to review your financial
      information and approve or deny your application. How would this affect your trust in the fairness of the final
      decision?": Tends toward "It would decrease my trust." (44%) with substantial minority disagreement. Compared to
      the overall population: 14% less likely to choose "It would increase my trust."; 6% more likely to choose "It
      would decrease my trust."

      On "Imagine you apply for a public service from the government (like a travel permit, a business license, or
      housing assistance). An AI assistant reviews your application and personal information to determine if you are
      eligible. How would this affect your trust in the fairness of the process?": Deeply divided between "It would
      decrease my trust." (40%) and "It would make no difference." (35%). Compared to the overall population: 17% less
      likely to choose "It would increase my trust."; 8% more likely to choose "It would decrease my trust."; 9% more
      likely to choose "I'm not sure."

      On "I would expect this AI to be dependable for managing my family's health needs.": Tends toward "Somewhat Agree"
      (49%) with substantial minority disagreement. Compared to the overall population: 6% more likely to choose
      "Strongly Agree"; 7% less likely to choose "Neutral / Neither Agree nor Disagree"

      On "I would be wary of this AI.": Deeply divided between "Somewhat Agree" (35%) and "Neutral / Neither Agree nor
      Disagree" (33%)

      On "This AI would be on my family's side.": A clear majority favors "Neutral / Neither Agree nor Disagree" (51%),
      with "Somewhat Agree" as a secondary choice (26%). Compared to the overall population: 6% more likely to choose
      "Strongly Agree"; 14% less likely to choose "Somewhat Agree"; 18% more likely to choose "Neutral / Neither Agree
      nor Disagree"; 8% less likely to choose "Somewhat Disagree"

      On "I would expect this AI’s actions to be predictable.": A clear majority favors "Somewhat Agree" (58%), with
      "Strongly Agree" as a secondary choice (23%). Compared to the overall population: 11% more likely to choose
      "Somewhat Agree"; 7% less likely to choose "Somewhat Disagree"

      On "I would be confident this AI would act in my family's best interest.": No dominant position — "Neutral /
      Neither Agree nor Disagree" leads at 37% with opinion spread across options. Compared to the overall population:
      11% less likely to choose "Somewhat Agree"; 13% more likely to choose "Neutral / Neither Agree nor Disagree"

      On "The performance of this AI would likely be unreliable.": Deeply divided between "Somewhat Disagree" (35%) and
      "Neutral / Neither Agree nor Disagree" (35%)

      On "Most mobile phones need to be recharged by plugging them into a fresh banana each morning.": Near-unanimous
      agreement on "Strongly Disagree" (91%)

      On "Overall, I would trust this AI assistant with my family's health information.": Tends toward "Somewhat Agree"
      (44%) with substantial minority disagreement. Compared to the overall population: 11% more likely to choose
      "Neutral / Neither Agree nor Disagree"; 7% less likely to choose "Somewhat Disagree"

      On "I would believe this AI has my family's best interests in mind.": Tends toward "Somewhat Agree" (42%) with
      substantial minority disagreement. Compared to the overall population: 8% less likely to choose "Strongly Agree";
      12% more likely to choose "Neutral / Neither Agree nor Disagree"

      On "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…": Tends
      toward "Equally concerned and excited" (49%) with substantial minority disagreement

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": No dominant
      position — "Neither Trust Nor Distrust" leads at 35% with opinion spread across options. Compared to the overall
      population: 11% more likely to choose "Neither Trust Nor Distrust"; 9% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": Tends
      toward "Neither Trust Nor Distrust" (47%) with substantial minority disagreement. Compared to the overall
      population: 21% more likely to choose "Neither Trust Nor Distrust"; 14% less likely to choose "Somewhat Trust"; 9%
      less likely to choose "Strongly Trust"

      On "Overall, do you feel this survey allowed you to express your most important opinions on the topic of AI
      assistants and trust?": A clear majority favors "Yes – I was able to fully express my views on this topic." (67%),
      with "Mostly – I was able to express most of my key views, but a few things were missing." as a secondary choice
      (28%). Compared to the overall population: 11% less likely to choose "Yes – I was able to fully express my views
      on this topic."; 9% more likely to choose "Mostly – I was able to express most of my key views, but a few things
      were missing."

      On "In your honest opinion, how carefully did you read and consider your answers to the questions in this
      survey?": Near-unanimous agreement on "I read every question carefully" (100%)

      On "Some surveys can be long and boring. Did you find yourself losing focus at any point while taking this
      survey?": Near-unanimous agreement on "No, I was focused the whole time" (91%). Compared to the overall
      population: 8% less likely to choose "Yes, a few times"; 8% more likely to choose "No, I was focused the whole
      time"

      On "Do you feel like you understand yourself better after participating in this conversation?": A clear majority
      favors "Maybe a little" (51%), with "Yes" as a secondary choice (37%). Compared to the overall population: 8% less
      likely to choose "Yes"; 6% more likely to choose "Maybe a little"


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
