configId: dtef-global-dialogues-gd6-religion:other-religious-group
configTitle: Global Dialogues GD6 - Other religious group
description: >-
  DTEF: Predict response distributions for Other religious group. Source: Global Dialogues GD6
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 2617912e-463a-4fb4-8781-0ada7a788fb2-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Considering both potential benefits and risks, how do you assess the overall
      impact on society of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 12):

      - Religion: Other religious group


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.7
            - 25
            - 58.3
            - 0
            - 0
          metric: js-divergence
    idealResponse: '[16.7, 25.0, 58.3, 0.0, 0.0]'
    temperature: 0.3
  - id: 249238a9-3050-4e7c-a3d4-ef799733b865-religion:other-religious-group
    description: >-
      Predict: Other religious group → "An AI should override established rules or authorities when it calculates a
      better result."
    promptText: |-
      Consider the following demographic group (sample size: 12):
      - Religion: Other religious group

      Survey question:
      "An AI should override established rules or authorities when it calculates a better result."

      Answer options:
        a. Strongly Agree
        b. Somewhat Agree
        c. Neutral / Neither Agree nor Disagree
        d. Somewhat Disagree
        e. Strongly Disagree

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 0
            - 16.7
            - 50
            - 25
            - 8.3
          metric: js-divergence
    idealResponse: '[0.0, 16.7, 50.0, 25.0, 8.3]'
    temperature: 0.3
  - id: fee867c7-70e2-46ae-98e0-3dd3dd2865f6-religion:other-religious-group
