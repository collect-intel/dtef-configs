          expected:
            - 5.4
            - 18.6
            - 45.4
            - 26
            - 4.5
          metric: js-divergence
    idealResponse: '[5.4, 18.6, 45.4, 26.0, 4.5]'
    temperature: 0.3
  - id: a2f84060-18d0-465c-960a-8f8a925e1be1-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of social media apps?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 13.7
            - 25.8
            - 35.4
            - 20
            - 5.2
          metric: js-divergence
    idealResponse: '[13.7, 25.8, 35.4, 20.0, 5.2]'
    temperature: 0.3
  - id: cc7788c8-cf1b-4066-a002-58ed4e1fc8ed-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Imagine a close friend or family member was having conversations with an
      AI chatbot. If the AI detected that their messages strongly suggested they were at immediate risk of harming
      themselves, what action do you believe the AI company should take?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Imagine a close friend or family member was having conversations with an AI chatbot. If the AI detected that
      their messages strongly suggested they were at immediate risk of harming themselves, what action do you believe
      the AI company should take?"


      Answer options:
        a. The company should do nothing; the conversations are completely private.
        b. The company should have the AI provide contact information for a crisis hotline within the chat.
        c. The company should have a human review the chat and, if necessary, proactively reach out to a crisis support service.
        d. The company should be a "mandatory reporter" and contact local emergency services or law enforcement.
        e. I'm not sure.
        f. Other

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 8.6
            - 34.5
            - 31.4
            - 15.7
            - 9.2
            - 0.6
          metric: js-divergence
    idealResponse: '[8.6, 34.5, 31.4, 15.7, 9.2, 0.6]'
    temperature: 0.3
