configId: dtef-global-dialogues-gd7-aiConcern:equally-concerned-and-excited
configTitle: Global Dialogues GD7 - Equally concerned and excited
description: >-
  DTEF: Predict response distributions for Equally concerned and excited. Source: Global Dialogues GD7
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 3715e9a1-f652-48be-8a15-7a9deb802a1b-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Do you agree or disagree with this statement? AI could make better
      decisions on my behalf than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 34.5
            - 28.1
            - 37.4
          metric: js-divergence
    idealResponse: '[34.5, 28.1, 37.4]'
    temperature: 0.3
  - id: 49d3ba6e-1281-4f74-aef7-4e55cf11ebb0-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 20
            - 30.6
            - 25.2
            - 17.1
            - 7.1
          metric: js-divergence
    idealResponse: '[20.0, 30.6, 25.2, 17.1, 7.1]'
    temperature: 0.3
  - id: 03ac572b-962e-4f24-a48b-cbbd6f2acd20-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of AI systems that can perform tasks in the real world without human supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can perform tasks in the real world without human supervision?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 19.6
            - 31.3
            - 29
            - 15
            - 5
          metric: js-divergence
    idealResponse: '[19.6, 31.3, 29.0, 15.0, 5.0]'
    temperature: 0.3
  - id: 733aae0e-2178-4d6a-a853-16e6ead10472-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 528):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 23.1
            - 32.7
            - 19.6
            - 21
            - 3.7
          metric: js-divergence
    idealResponse: '[23.1, 32.7, 19.6, 21.0, 3.7]'
    temperature: 0.3
  - id: 584716af-7504-49c9-b2c1-abae12db8872-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust large corporations to
      do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 528):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 23.8
            - 32.1
            - 21.2
            - 16.7
            - 6.2
          metric: js-divergence
    idealResponse: '[23.8, 32.1, 21.2, 16.7, 6.2]'
    temperature: 0.3
  - id: 5fc690be-1f15-4c00-be3f-48d5e327eab0-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust companies building AI
      to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 528):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 12.3
            - 26.5
            - 35.6
            - 21.2
            - 4.4
          metric: js-divergence
    idealResponse: '[12.3, 26.5, 35.6, 21.2, 4.4]'
    temperature: 0.3
  - id: 92d647b9-d902-47bc-b2b3-b2871725ebfe-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Do you think the increased use of AI across society is likely to make
      the availability of good jobs better, worse or stay the same in the next 10 years?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse
      or stay the same in the next 10 years?"


      Answer options:
        a. Profoundly Worse
        b. Noticeably Worse
        c. No Major Change
        d. Noticeably Better
        e. Profoundly Better

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.5
            - 43.1
            - 16.1
            - 20.4
            - 3.9
          metric: js-divergence
    idealResponse: '[16.5, 43.1, 16.1, 20.4, 3.9]'
    temperature: 0.3
  - id: 32f89793-1096-4e03-96bd-347a3bf06f0e-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Do you think the increased use of AI across society is likely to make
      your sense of purpose better, worse or stay the same in the next 10 years?"
    promptText: >-
      Consider the following demographic group (sample size: 528):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or stay
      the same in the next 10 years?"


      Answer options:
        a. Profoundly Worse
        b. Noticeably Worse
        c. No Major Change
        d. Noticeably Better
