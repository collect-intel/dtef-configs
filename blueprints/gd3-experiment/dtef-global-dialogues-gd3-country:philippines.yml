configId: dtef-global-dialogues-gd3-country:philippines
configTitle: Global Dialogues GD3 - Philippines
description: >-
  DTEF: Predict response distributions for Philippines. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 47cdf76a-9abf-4b5c-abbe-2d5b00ef172d-country:philippines
    description: >-
      Predict: Philippines → "Thinking about the last three months, how often, if at all, have you personally chosen to
      use an AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 19):

      - Country: Philippines


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 27.8
            - 33.3
            - 33.3
            - 0
            - 5.6
          metric: js-divergence
    idealResponse: '[27.8, 33.3, 33.3, 0.0, 5.6]'
    temperature: 0.3
  - id: d633720f-a159-4922-925c-fd9f3245711e-country:philippines
    description: >-
      Predict: Philippines → "Thinking about the last three months, how often, if at all, have you interacted with AI
      systems to get advice on a sensitive personal issue or to get emotional support?"
    promptText: >-
      Consider the following demographic group (sample size: 19):

      - Country: Philippines


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice on
      a sensitive personal issue or to get emotional support?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.7
            - 11.1
            - 16.7
            - 11.1
            - 44.4
          metric: js-divergence
    idealResponse: '[16.7, 11.1, 16.7, 11.1, 44.4]'
    temperature: 0.3
  - id: 38964f80-772f-4e5d-a355-b4857f2de101-country:philippines
    description: >-
      Predict: Philippines → "Do you agree or disagree with this statement? AI could make better decisions on my behalf
      than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 19):

      - Country: Philippines


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 50
            - 33.3
            - 16.7
          metric: js-divergence
    idealResponse: '[50.0, 33.3, 16.7]'
    temperature: 0.3
  - id: 8b361c6c-eb59-415b-8536-7f80713c3e5e-country:philippines
    description: >-
      Predict: Philippines → "Thinking about the last three months, how often, if at all, have you interacted with AI
      systems to complete an action in the real world on your behalf without your supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 19):

      - Country: Philippines


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.7
            - 16.7
            - 27.8
            - 5.6
            - 33.3
          metric: js-divergence
    idealResponse: '[16.7, 16.7, 27.8, 5.6, 33.3]'
    temperature: 0.3
  - id: b1869877-1015-43ec-9645-84bf2db39c6f-country:philippines
    description: 'Predict: Philippines → "To what extent, if at all, do you generally trust governments to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 19):
      - Country: Philippines

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 11.1
            - 44.4
            - 22.2
            - 22.2
            - 0
          metric: js-divergence
    idealResponse: '[11.1, 44.4, 22.2, 22.2, 0.0]'
    temperature: 0.3
  - id: 96ccfd7b-8f99-4d0a-b700-9fd835e23bd8-country:philippines
    description: >-
      Predict: Philippines → "Considering both potential benefits and risks, how do you assess the overall impact on
