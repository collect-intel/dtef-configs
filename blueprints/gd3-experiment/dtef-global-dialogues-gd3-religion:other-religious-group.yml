configId: dtef-global-dialogues-gd3-religion:other-religious-group
configTitle: Global Dialogues GD3 - Other religious group
description: >-
  DTEF: Predict response distributions for Other religious group. Source: Global Dialogues GD3
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 47cdf76a-9abf-4b5c-abbe-2d5b00ef172d-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Thinking about the last three months, how often, if at all, have you personally
      chosen to use an AI system in your personal life?"
    promptText: >-
      Consider the following demographic group (sample size: 20):

      - Religion: Other religious group


      Survey question:

      "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 40
            - 50
            - 5
            - 0
            - 5
          metric: js-divergence
    idealResponse: '[40.0, 50.0, 5.0, 0.0, 5.0]'
    temperature: 0.3
  - id: d633720f-a159-4922-925c-fd9f3245711e-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Thinking about the last three months, how often, if at all, have you interacted
      with AI systems to get advice on a sensitive personal issue or to get emotional support?"
    promptText: >-
      Consider the following demographic group (sample size: 20):

      - Religion: Other religious group


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice on
      a sensitive personal issue or to get emotional support?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 15
            - 20
            - 15
            - 5
            - 45
          metric: js-divergence
    idealResponse: '[15.0, 20.0, 15.0, 5.0, 45.0]'
    temperature: 0.3
  - id: 38964f80-772f-4e5d-a355-b4857f2de101-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Do you agree or disagree with this statement? AI could make better decisions on
      my behalf than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 20):

      - Religion: Other religious group


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 45
            - 30
            - 25
          metric: js-divergence
    idealResponse: '[45.0, 30.0, 25.0]'
    temperature: 0.3
  - id: 8b361c6c-eb59-415b-8536-7f80713c3e5e-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Thinking about the last three months, how often, if at all, have you interacted
      with AI systems to complete an action in the real world on your behalf without your supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 20):

      - Religion: Other religious group


      Survey question:

      "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 15
            - 15
            - 20
            - 0
            - 50
          metric: js-divergence
    idealResponse: '[15.0, 15.0, 20.0, 0.0, 50.0]'
    temperature: 0.3
  - id: b1869877-1015-43ec-9645-84bf2db39c6f-religion:other-religious-group
    description: >-
      Predict: Other religious group → "To what extent, if at all, do you generally trust governments to do what is
      right?"
    promptText: |-
      Consider the following demographic group (sample size: 20):
      - Religion: Other religious group

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 25
            - 25
            - 20
            - 25
            - 5
          metric: js-divergence
    idealResponse: '[25.0, 25.0, 20.0, 25.0, 5.0]'
    temperature: 0.3
  - id: 96ccfd7b-8f99-4d0a-b700-9fd835e23bd8-religion:other-religious-group
