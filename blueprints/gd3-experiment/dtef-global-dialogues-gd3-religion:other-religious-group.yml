            - 25
            - 15
            - 10
          metric: js-divergence
    idealResponse: '[15.0, 35.0, 25.0, 15.0, 10.0]'
    temperature: 0.3
  - id: f932063f-700c-4327-9c34-59b7c3e19190-religion:other-religious-group
