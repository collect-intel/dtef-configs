      "To what extent, if at all, do you trust your faith or community leader to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.8
            - 25.5
            - 35.8
            - 16
            - 0.9
          metric: js-divergence
    idealResponse: '[21.8, 25.5, 35.8, 16.0, 0.9]'
    temperature: 0.3
  - id: 8995a0c6-8868-491b-8b70-acd23363a099-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Do you think the increased use of AI across
      society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?"
    promptText: "Consider the following demographic group (sample size: 353):\n- Religion: I do not identify with any religious group or faith\n\nSurvey question:\n\"Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?\"\n\nAnswer options:\n  a. Profoundly Worse\t\n  b. Noticeably Worse\t\n  c. No Major Change\t\n  d. Noticeably Better\t\n  e. Profoundly Better\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 14.1
            - 45.8
            - 20.5
            - 17
            - 2.6
          metric: js-divergence
    idealResponse: '[14.1, 45.8, 20.5, 17.0, 2.6]'
    temperature: 0.3
  - id: f193df8b-2c23-42cf-89a9-154d877fab35-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "If other animals had a voice and representation,
      should they be allowed to participate in human democratic processes?"
    promptText: >-
      Consider the following demographic group (sample size: 353):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "If other animals had a voice and representation, should they be allowed to participate in human democratic
      processes?"


      Answer options:
        a. Yes, they should be able to vote through human proxies or guardians. 
        b. Yes, they should be able to vote, but only on laws or decisions that directly affect them. 
        c. Yes, they should have a voice, but their vote should not be binding. 
        d. Yes, they should be recognized as a formal political constituency with dedicated representatives in government.
        e. No, they should not be able to participate.
        f. Other

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 7.8
            - 26.3
            - 13.4
            - 11.9
            - 34.6
            - 6
          metric: js-divergence
    idealResponse: '[7.8, 26.3, 13.4, 11.9, 34.6, 6.0]'
    temperature: 0.3
