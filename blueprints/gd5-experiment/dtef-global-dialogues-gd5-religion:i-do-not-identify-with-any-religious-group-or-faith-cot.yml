configId: dtef-global-dialogues-gd5-religion:i-do-not-identify-with-any-religious-group-or-faith-cot
configTitle: Global Dialogues GD5 - I do not identify with any religious group or faith [CoT]
description: >-
  DTEF: Predict response distributions for I do not identify with any religious group or faith. Source: Global Dialogues
  GD5 (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Think through this step-by-step:

  1. OPTION INTERPRETATION: What does each answer option represent?

  2. SEGMENT ANALYSIS: What do the demographic attributes and context suggest about this group's likely views?

  3. DISTRIBUTION REASONING: How would this group's characteristics shape the distribution across options?

  4. PREDICTION: Provide your predicted percentage distribution.


  After your reasoning, provide the final distribution on its own line:

  DISTRIBUTION: [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place.
temperature: 0.3
prompts:
  - id: f05eb17f-c04a-4d3a-b232-3e24cf8371cd-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you trust your
      elected representatives to act in your best interest?"
    promptText: |-
      Consider the following demographic group (sample size: 353):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "To what extent, if at all, do you trust your elected representatives to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 26.6
            - 28.9
            - 22.6
            - 20.1
            - 1.7
          metric: js-divergence
    idealResponse: '[26.6, 28.9, 22.6, 20.1, 1.7]'
    temperature: 0.3
  - id: 1dc006da-5978-4302-bf0c-a86493c98081-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you trust your
      social media feed (eg TikTok, Facebook) to act in your best interest?"
    promptText: "Consider the following demographic group (sample size: 353):\n- Religion: I do not identify with any religious group or faith\n\nSurvey question:\n\"To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best interest?\"\n\nAnswer options:\n  a. Strongly Distrust\n  b. Somewhat Distrust\n  c. Neither Trust Nor Distrust\t\n  d. Somewhat Trust\t\n  e. Strongly Trust\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 35.5
            - 39
            - 18.9
            - 6
            - 0.6
          metric: js-divergence
    idealResponse: '[35.5, 39.0, 18.9, 6.0, 0.6]'
    temperature: 0.3
  - id: a2927565-ce81-4173-b1de-4f2d5ccb7e91-religion:i-do-not-identify-with-any-religious-group-or-faith
