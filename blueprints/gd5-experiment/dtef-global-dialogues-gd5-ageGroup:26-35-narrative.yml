n \"Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at work?\": Tends toward \"daily\t\" (50%) with substantial minority disagreement\nOn \"Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in your personal life?\": Tends toward \"daily\t\" (50%) with substantial minority disagreement\nOn \"Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice on a sensitive personal issue or to get emotional support?\": Deeply divided between \"never\" (27%) and \"weekly\" (23%)\nOn \"Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an action in the real world on your behalf without your supervision?\": A clear majority favors \"never\" (53%), with \"weekly\t\" as a secondary choice (18%)\nOn \"Do you think the increased use of AI across society is likely to make your cost of living better, worse or stay the same in the next 10 years?\": Tends toward \"Noticeably Better\t\" (45%) with substantial minority disagreement\nOn \"Do you think the increased use of AI across society is likely to make the amount of free time you have better, worse or stay the same in the next 10 years?\": A clear majority favors \"Noticeably Better\t\" (51%), with \"No Major Change\t\" as a secondary choice (23%)\nOn \"Do you think the increased use of AI across society is likely to make your community's well-being better, worse or stay the same in the next 10 years?\": Tends toward \"Noticeably Better\t\" (46%) with substantial minority disagreement\nOn \"Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or stay the same in the next 10 years?\": No dominant position — \"No Major Change\t\" leads at 38% with opinion spread across options\nOn \"Which statement best reflects your view?\": Tends toward \"Humans are a part of nature but fundamentally different from other animals\" (49%) with substantial minority disagreement\nOn \"Which statement best reflects your view?\": A clear majority favors \"Humans are fundamentally superior to other animals\" (63%), with \"Humans are fundamentally equal to other animals\" as a secondary choice (35%)\nOn \"Caring for animals (e.g., feeding, grooming, cleaning up after them)\": No dominant position — \"Always\" leads at 34% with opinion spread across options\nOn \"Sharing physical space (e.g., living with pets, encountering service animals, or passing animals on your commute)\": Tends toward \"Always\" (42%) with substantial minority disagreement\nOn \"Noticing or observing animals (e.g., birdwatching, tracking urban wildlife, noticing animals in parks or neighborhoods)\": Deeply divided between \"Sometimes\" (32%) and \"Often \" (29%)\nOn \"Do you believe that other animals have their own forms of language?\": A clear majority favors \"Strongly believe\" (62%), with \"Somewhat believe\" as a secondary choice (28%)\nOn \"Do you believe that other animals have their own forms of emotion?\": A clear majority favors \"Strongly believe\" (68%), with \"Somewhat believe\" as a secondary choice (26%)\nOn \"Do you believe that other animals have their own forms of culture?\": Deeply divided between \"Somewhat believe\" (34%) and \"Strongly believe\" (33%)\nOn \"To what extent does knowing this impact your perspective on animals?\": Deeply divided between \"Somewhat\" (25%) and \"Quite a bit\" (25%)\nOn \"Have you ever tried to imagine experiencing the world through another animal's senses?\": Tends toward \"Yes, sometimes\" (40%) with substantial minority disagreement\nOn \"How important do you think it is for humans to understand how other animals experience the world?\": Tends toward \"Very important\" (44%) with substantial minority disagreement\nOn \"Do you think this is a good use of AI technology?\": Tends toward \"It depends\" (47%) with substantial minority disagreement\nOn \"If AI could reliably interpret animal communication, how interested would you be to know what animals \"say\" or \"feel\"?\": Near-unanimous agreement on \"Very interested\" (72%)\nOn \"Assuming we have the ability to interpret animal communication, how much would you trust that AI could truly and comprehensively reflect what an animal is trying to communicate, without being distorted by AI’s programming or human assumptions?\": Tends toward \"Somewhat trust\" (43%) with substantial minority disagreement\nOn \"Which approach do you think is best for humans to interact with non-humans?\": A clear majority favors \"Communicate directly using technology \" (65%), with \"Interact with a computer simulation of real non-human animals\" as a secondary choice (35%)\nOn \"Which approach feels most appropriate to you for protecting animals?\": A clear majority favors \"Future A: Building ongoing relationships and communication\t\" (62%), with \"Future B: Including all voices in shared decision-making\t\" as a secondary choice (25%)\nOn \"If AI helped us understand what an animal really needs, should that animal have the right to a representative such as a lawyer to defend its rights and protections?\": Tends toward \"Yes\" (44%) with substantial minority disagreement\nOn \"If AI could accurately express the voice of non-human animals, we might want to allow them to participate in decision-making. In this situation, which of these do you think is best?\": A clear majority favors \"Animals should have humans represent them when decisions are made that directly impact them \" (57%), with \"Animals should represent themselves (via tech assisted tools)\" as a secondary choice (43%)\nOn \"Consider a scenario where societies of the future are governed by AI systems that integrate data from both human and non-human sources (such as environmental sensors and wildlife communication networks) to guide community decisions (e.g., urban planning, conservation zones). How appealing is this vision of an ecocentric, integrated society?\": A clear majority favors \"Somewhat appealing\" (61%), with \"Not appealing\" as a secondary choice (20%)\nOn \"If other animals had a voice and representation, should they be allowed to participate in human democratic processes?\": No dominant position — \"No, they should not be able to participate.\" leads at 35% with opinion spread across options\nOn \"Animal communication should be restricted to authorized professionals with certified credentials and appropriate training.\": Tends toward \"Strongly agree\" (43%) with substantial minority disagreement\nOn \"Everyone should be allowed to listen to animals, but responding should be restricted to certain people.\": No dominant position — \"Somewhat agree\" leads at 39% with opinion spread across options\nOn \"Companies that profit from animals (like farms, zoos, or entertainment industries) should be subject to strict rules about if, when, and how they can communicate with animals.\": A clear majority favors \"Strongly agree\" (59%), with \"Somewhat agree\" as a secondary choice (31%)\nOn \"If we record an elephant’s conversation or a whale’s song, who should own that recording?\": Tends toward \"the community protecting those animals\" (42%) with substantial minority disagreement\nOn \"Which statement best reflects your view:\": Tends toward \"Humans are a part of nature but fundamentally different from other animals\" (45%) with substantial minority disagreement\nOn \"Which statement best reflects your view?\": A clear majority favors \"Humans are fundamentally superior to other animals\" (58%), with \"Humans are fundamentally equal to other animals\" as a secondary choice (39%)\nOn \"Do you feel you were able to fully express your views on your culture, your values, and what you want for the future in this conversation? (through what you responded and how you voted)\": Near-unanimous agreement on \"Yes – I was able to fully express my views on these topics\" (74%)\nOn \"Do you feel like you understand yourself better after participating in this conversation?\": A clear majority favors \"Yes\" (59%), with \"Maybe a little\" as a secondary choice (36%)\n\nSurvey question:\n\"Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?\"\n\nAnswer options:\n  a. Profoundly Worse\t\n  b. Noticeably Worse\t\n  c. No Major Change\t\n  d. Noticeably Better\t\n  e. Profoundly Better\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
