      Q2: "If AI helped us understand what an animal really needs, should that animal have the right to a representative
      such as a lawyer to defend its rights and protections?"
        Options: a. Yes, b. No, c. Not sure

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
