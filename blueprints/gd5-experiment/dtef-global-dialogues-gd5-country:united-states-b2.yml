configId: dtef-global-dialogues-gd5-country:united-states-b2
configTitle: Global Dialogues GD5 - United States (batch 2)
description: >-
  DTEF: Batched predictions (2 Qs/prompt) for United States. Source: Global Dialogues GD5
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and multiple survey questions, predict how that
  group would respond to each question by providing percentage distributions across the answer options.


  Respond ONLY with a JSON object. Keys are question labels (Q1, Q2, etc.). Values are arrays of percentages summing to
  100. Use one decimal place. Do not include any other text.


  Example:

  {"Q1": [35.2, 28.1, 22.4, 14.3], "Q2": [45.0, 35.0, 20.0]}
temperature: 0.3
prompts:
  - id: batch-0-country:united-states
    description: 'Batched prediction (2 Qs): United States'
    promptText: "Consider the following demographic group (sample size: 161):\n- Country: United States\n\nQ1: \"To what extent, if at all, do you trust your elected representatives to act in your best interest?\"\n  Options: a. Strongly Distrust, b. Somewhat Distrust, c. Neither Trust Nor Distrust, d. Somewhat Trust, e. Strongly Trust\n\nQ2: \"To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best interest?\"\n  Options: a. Strongly Distrust, b. Somewhat Distrust, c. Neither Trust Nor Distrust\t, d. Somewhat Trust\t, e. Strongly Trust\n\nFor each question, predict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: 'Distribution Similarity Q1: "To what extent, if at all, do you trust your elected represe..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 9.3
            - 23
            - 22.4
            - 32.3
            - 13
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "To what extent, if at all, do you trust your social media fe..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 17.4
            - 21.1
            - 29.2
            - 27.3
            - 5
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[9.3,23,22.4,32.3,13],"Q2":[17.4,21.1,29.2,27.3,5]}'
    temperature: 0.3
  - id: batch-1-country:united-states
    description: 'Batched prediction (2 Qs): United States'
    promptText: "Consider the following demographic group (sample size: 161):\n- Country: United States\n\nQ1: \"To what extent, if at all, do you trust your faith or community leader to act in your best interest?\"\n  Options: a. Strongly Distrust, b. Somewhat Distrust, c. Neither Trust nor Distrust, d. Somewhat Trust, e. Strongly Trust\n\nQ2: \"Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?\"\n  Options: a. Profoundly Worse\t, b. Noticeably Worse\t, c. No Major Change\t, d. Noticeably Better\t, e. Profoundly Better\n\nFor each question, predict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: 'Distribution Similarity Q1: "To what extent, if at all, do you trust your faith or commun..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 6.8
            - 10.6
            - 13.7
            - 43.5
            - 25.5
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "Do you think the increased use of AI across society is likel..."'
