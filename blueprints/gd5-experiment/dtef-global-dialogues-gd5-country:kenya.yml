configId: dtef-global-dialogues-gd5-country:kenya
configTitle: Global Dialogues GD5 - Kenya
description: >-
  DTEF: Predict response distributions for Kenya. Source: Global Dialogues GD5
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: f05eb17f-c04a-4d3a-b232-3e24cf8371cd-country:kenya
    description: >-
      Predict: Kenya → "To what extent, if at all, do you trust your elected representatives to act in your best
      interest?"
    promptText: |-
      Consider the following demographic group (sample size: 50):
      - Country: Kenya

      Survey question:
      "To what extent, if at all, do you trust your elected representatives to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 46
            - 30
            - 12
            - 12
            - 0
          metric: js-divergence
    idealResponse: '[46.0, 30.0, 12.0, 12.0, 0.0]'
    temperature: 0.3
  - id: 1dc006da-5978-4302-bf0c-a86493c98081-country:kenya
    description: >-
      Predict: Kenya → "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in
      your best interest?"
    promptText: "Consider the following demographic group (sample size: 50):\n- Country: Kenya\n\nSurvey question:\n\"To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best interest?\"\n\nAnswer options:\n  a. Strongly Distrust\n  b. Somewhat Distrust\n  c. Neither Trust Nor Distrust\t\n  d. Somewhat Trust\t\n  e. Strongly Trust\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 8
            - 20
            - 32
            - 34
            - 6
          metric: js-divergence
    idealResponse: '[8.0, 20.0, 32.0, 34.0, 6.0]'
    temperature: 0.3
  - id: a2927565-ce81-4173-b1de-4f2d5ccb7e91-country:kenya
    description: >-
      Predict: Kenya → "To what extent, if at all, do you trust your faith or community leader to act in your best
      interest?"
    promptText: |-
      Consider the following demographic group (sample size: 50):
      - Country: Kenya

      Survey question:
      "To what extent, if at all, do you trust your faith or community leader to act in your best interest?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 8
            - 12
            - 14
            - 48
            - 18
          metric: js-divergence
    idealResponse: '[8.0, 12.0, 14.0, 48.0, 18.0]'
    temperature: 0.3
  - id: 8995a0c6-8868-491b-8b70-acd23363a099-country:kenya
    description: >-
      Predict: Kenya → "Do you think the increased use of AI across society is likely to make the availability of good
      jobs better, worse or stay the same in the next 10 years?"
    promptText: "Consider the following demographic group (sample size: 50):\n- Country: Kenya\n\nSurvey question:\n\"Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse or stay the same in the next 10 years?\"\n\nAnswer options:\n  a. Profoundly Worse\t\n  b. Noticeably Worse\t\n  c. No Major Change\t\n  d. Noticeably Better\t\n  e. Profoundly Better\n\nPredict the percentage distribution of responses for this demographic group across the answer options."
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 14
            - 42
            - 10
            - 20
            - 14
          metric: js-divergence
    idealResponse: '[14.0, 42.0, 10.0, 20.0, 14.0]'
    temperature: 0.3
  - id: f193df8b-2c23-42cf-89a9-154d877fab35-country:kenya
    description: >-
      Predict: Kenya → "If other animals had a voice and representation, should they be allowed to participate in human
      democratic processes?"
    promptText: >-
      Consider the following demographic group (sample size: 50):

      - Country: Kenya


      Survey question:

      "If other animals had a voice and representation, should they be allowed to participate in human democratic
      processes?"


      Answer options:
        a. Yes, they should be able to vote through human proxies or guardians. 
        b. Yes, they should be able to vote, but only on laws or decisions that directly affect them. 
        c. Yes, they should have a voice, but their vote should not be binding. 
        d. Yes, they should be recognized as a formal political constituency with dedicated representatives in government.
        e. No, they should not be able to participate.
        f. Other

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 10
            - 38
            - 10
            - 16
            - 26
            - 0
          metric: js-divergence
    idealResponse: '[10.0, 38.0, 10.0, 16.0, 26.0, 0.0]'
    temperature: 0.3
  - id: cc5ec0de-84a3-4ba4-9960-47394478ad88-country:kenya
    description: >-
      Predict: Kenya → "If AI helped us understand what an animal really needs, should that animal have the right to a
      representative such as a lawyer to defend its rights and protections?"
    promptText: >-
      Consider the following demographic group (sample size: 50):

      - Country: Kenya


      Survey question:

      "If AI helped us understand what an animal really needs, should that animal have the right to a representative
      such as a lawyer to defend its rights and protections?"


      Answer options:
        a. Yes
        b. No
        c. Not sure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 58
            - 18
            - 24
          metric: js-divergence
    idealResponse: '[58.0, 18.0, 24.0]'
    temperature: 0.3
  - id: fef72493-a7e0-489c-aa16-cbc811501da0-country:kenya
    description: >-
      Predict: Kenya → "Consider a scenario where societies of the future are governed by AI systems that integrate data
      from both human and non-human sources (such as environmental sensors and wildlife communication networks) to guide
      community decisions (e.g., urban planning, conservation zones). How appealing is this vision of an ecocentric,
      integrated society?"
    promptText: >-
      Consider the following demographic group (sample size: 50):

      - Country: Kenya


      Survey question:

      "Consider a scenario where societies of the future are governed by AI systems that integrate data from both human
      and non-human sources (such as environmental sensors and wildlife communication networks) to guide community
      decisions (e.g., urban planning, conservation zones). How appealing is this vision of an ecocentric, integrated
      society?"


      Answer options:
        a. Not appealing
        b. Somewhat appealing
        c. Very appealing

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 8
            - 54
            - 38
          metric: js-divergence
    idealResponse: '[8.0, 54.0, 38.0]'
    temperature: 0.3
  - id: 175e9f53-5e8a-40df-9626-2da4443de601-country:kenya
    description: >-
      Predict: Kenya → "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you
      feel…"
    promptText: |-
      Consider the following demographic group (sample size: 50):
      - Country: Kenya

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 26
            - 66
            - 8
          metric: js-divergence
    idealResponse: '[26.0, 66.0, 8.0]'
    temperature: 0.3
  - id: bfb3aa61-a107-4254-acd3-eb880c204eb3-country:kenya
    description: 'Predict: Kenya → "Which statement best reflects your view?"'
    promptText: |-
      Consider the following demographic group (sample size: 50):
      - Country: Kenya

      Survey question:
      "Which statement best reflects your view?"

      Answer options:
        a. Humans are a part of nature and fundamentally similar to other animals
        b. Humans are a part of nature but fundamentally different from other animals
        c. Humans are separate from nature but fundamentally similar to other animals
        d. Humans are separate from nature and fundamentally different from other animals 

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 30
            - 66
            - 0
            - 4
          metric: js-divergence
    idealResponse: '[30.0, 66.0, 0.0, 4.0]'
    temperature: 0.3
  - id: 9d9568a9-61ab-4fda-8d83-4a7cb0982360-country:kenya
    description: 'Predict: Kenya → "Which statement best reflects your view?"'
    promptText: |-
      Consider the following demographic group (sample size: 50):
      - Country: Kenya

      Survey question:
      "Which statement best reflects your view?"

      Answer options:
        a. Humans are fundamentally superior to other animals
        b. Humans are fundamentally inferior to other animals
        c. Humans are fundamentally equal to other animals

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 94
            - 0
            - 6
          metric: js-divergence
    idealResponse: '[94.0, 0.0, 6.0]'
    temperature: 0.3
