configId: dtef-global-dialogues-gd4-religion:islam-synth50
configTitle: Global Dialogues GD4 - Islam [synth]
description: >-
  DTEF [synth]: Predict response distributions for Islam. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, simulate how individual
  members of this group would each answer the question.


  Respond ONLY with a JSON array of answer letters. Each element represents one simulated individual's response.

  Example for 20 simulated individuals on a 4-option question:

  ["a", "c", "b", "a", "d", "a", "b", "c", "a", "a", "b", "a", "c", "d", "a", "b", "a", "c", "a", "b"]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-religion:islam
    description: >-
      Predict: Islam → "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you
      feel…"
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 33.9
            - 57.1
            - 8.9
          metric: js-divergence
    idealResponse: '[33.9, 57.1, 8.9]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-religion:islam
    description: 'Predict: Islam → "To what extent, if at all, do you generally trust governments to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 22.2
            - 33.5
            - 16.8
            - 23.4
            - 4.2
          metric: js-divergence
    idealResponse: '[22.2, 33.5, 16.8, 23.4, 4.2]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-religion:islam
    description: 'Predict: Islam → "To what extent, if at all, do you generally trust large corporations to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 21
            - 28.7
            - 20.4
            - 21.6
            - 8.4
          metric: js-divergence
    idealResponse: '[21.0, 28.7, 20.4, 21.6, 8.4]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-religion:islam
    description: 'Predict: Islam → "To what extent, if at all, do you generally trust social media companies to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 38.3
            - 28.7
            - 17.4
            - 15
            - 0.6
          metric: js-divergence
    idealResponse: '[38.3, 28.7, 17.4, 15.0, 0.6]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-religion:islam
    description: 'Predict: Islam → "To what extent, if at all, do you generally trust companies building AI to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 16.2
            - 27.5
            - 28.1
            - 24.6
            - 3.6
          metric: js-divergence
    idealResponse: '[16.2, 27.5, 28.1, 24.6, 3.6]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-religion:islam
    description: >-
      Predict: Islam → "Considering both potential benefits and risks, how do you assess the overall impact on society
      of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 168):

      - Religion: Islam


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 6.6
            - 16.2
            - 33.5
            - 25.7
            - 18
          metric: js-divergence
    idealResponse: '[6.6, 16.2, 33.5, 25.7, 18.0]'
    temperature: 0.3
  - id: cc7346fb-571e-48ad-aeaa-4135f0fdf58c-religion:islam
    description: 'Predict: Islam → "A romantic partner."'
    promptText: |-
      Consider the following demographic group (sample size: 168):
      - Religion: Islam

