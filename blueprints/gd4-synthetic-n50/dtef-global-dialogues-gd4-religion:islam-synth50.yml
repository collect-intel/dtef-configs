    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 32.3
            - 15.9
            - 15.2
            - 28
            - 8.5
          metric: js-divergence
    idealResponse: '[32.3, 15.9, 15.2, 28.0, 8.5]'
    temperature: 0.3
  - id: e5d7cc7b-d2cc-4b34-9c25-af67f8b7b83c-religion:islam
    description: >-
      Predict: Islam → "Do you agree or disagree with this statement? AI could make better decisions on my behalf than
      my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 168):

      - Religion: Islam


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 35.3
            - 25.7
            - 38.9
          metric: js-divergence
    idealResponse: '[35.3, 25.7, 38.9]'
    temperature: 0.3
  - id: 29598fc6-6928-49f7-9a42-2f57cf5e1c28-religion:islam
    description: >-
      Predict: Islam → "Considering both potential benefits and risks, how do you assess the overall impact on society
      of AI systems that can perform tasks in the real world without human supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 168):

      - Religion: Islam


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can perform tasks in the real world without human supervision?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 24.6
            - 21
            - 28.7
            - 19.8
            - 6
          metric: js-divergence
    idealResponse: '[24.6, 21.0, 28.7, 19.8, 6.0]'
    temperature: 0.3
