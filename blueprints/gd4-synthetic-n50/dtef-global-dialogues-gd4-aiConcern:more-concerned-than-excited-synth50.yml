            - 14.7
            - 10.8
            - 3.9
          metric: js-divergence
    idealResponse: '[46.1, 24.5, 14.7, 10.8, 3.9]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 107):

      - Ai Concern: More concerned than excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
