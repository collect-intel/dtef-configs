configId: dtef-global-dialogues-gd4-aiConcern:more-concerned-than-excited-synth50
configTitle: Global Dialogues GD4 - More concerned than excited [synth]
description: >-
  DTEF [synth]: Predict response distributions for More concerned than excited. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, simulate how individual
  members of this group would each answer the question.


  Respond ONLY with a JSON array of answer letters. Each element represents one simulated individual's response.

  Example for 20 simulated individuals on a 4-option question:

  ["a", "c", "b", "a", "d", "a", "b", "c", "a", "a", "b", "a", "c", "d", "a", "b", "a", "c", "a", "b"]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "Overall, would you say the increased use of artificial intelligence (AI)
      in daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 107):
      - Ai Concern: More concerned than excited

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 0
            - 0
            - 100
          metric: js-divergence
    idealResponse: '[0.0, 0.0, 100.0]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 107):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 38.2
            - 24.5
            - 15.7
            - 16.7
            - 4.9
          metric: js-divergence
    idealResponse: '[38.2, 24.5, 15.7, 16.7, 4.9]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust large corporations to do
      what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 107):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 50
            - 20.6
            - 9.8
            - 12.7
            - 6.9
          metric: js-divergence
    idealResponse: '[50.0, 20.6, 9.8, 12.7, 6.9]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust social media companies
      to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 107):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 50 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 50
            - 29.4
            - 9.8
            - 7.8
            - 2.9
          metric: js-divergence
    idealResponse: '[50.0, 29.4, 9.8, 7.8, 2.9]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust companies building AI to
      do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 107):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

