configId: dtef-global-dialogues-gd4-aiConcern:more-excited-than-concerned
configTitle: Global Dialogues GD4 - More excited than concerned
description: >-
  DTEF: Predict response distributions for More excited than concerned. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
temperatures:
  - 0
  - 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "Overall, would you say the increased use of artificial intelligence (AI)
      in daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 384):
      - Ai Concern: More excited than concerned

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 100
            - 0
            - 0
          metric: js-divergence
    idealResponse: '[100.0, 0.0, 0.0]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 384):
      - Ai Concern: More excited than concerned

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 17.8
            - 33
            - 16.2
            - 26.3
            - 6.6
          metric: js-divergence
    idealResponse: '[17.8, 33.0, 16.2, 26.3, 6.6]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "To what extent, if at all, do you generally trust large corporations to do
      what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 384):
      - Ai Concern: More excited than concerned

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 17.8
            - 28.5
            - 18.6
            - 26.6
            - 8.5
          metric: js-divergence
    idealResponse: '[17.8, 28.5, 18.6, 26.6, 8.5]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "To what extent, if at all, do you generally trust social media companies
      to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 384):
      - Ai Concern: More excited than concerned

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 24.5
            - 32.2
            - 22.6
            - 16
            - 4.8
          metric: js-divergence
    idealResponse: '[24.5, 32.2, 22.6, 16.0, 4.8]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "To what extent, if at all, do you generally trust companies building AI to
      do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 384):
      - Ai Concern: More excited than concerned

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 4.3
            - 19.1
            - 25.3
            - 39.6
            - 11.7
          metric: js-divergence
    idealResponse: '[4.3, 19.1, 25.3, 39.6, 11.7]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-aiConcern:more-excited-than-concerned
    description: >-
      Predict: More excited than concerned → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 384):

      - Ai Concern: More excited than concerned


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 4.3
            - 5.6
            - 18.6
            - 34
            - 37.5
          metric: js-divergence
    idealResponse: '[4.3, 5.6, 18.6, 34.0, 37.5]'
    temperature: 0.3
  - id: cc7346fb-571e-48ad-aeaa-4135f0fdf58c-aiConcern:more-excited-than-concerned
