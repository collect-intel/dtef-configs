    description: >-
      Predict: More excited than concerned → "Do you agree or disagree with this statement? AI could make better
      decisions on my behalf than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 384):

      - Ai Concern: More excited than concerned


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
