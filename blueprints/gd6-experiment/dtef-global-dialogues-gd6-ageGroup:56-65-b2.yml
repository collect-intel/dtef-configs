configId: dtef-global-dialogues-gd6-ageGroup:56-65-b2
configTitle: Global Dialogues GD6 - 56-65 (batch 2)
description: >-
  DTEF: Batched predictions (2 Qs/prompt) for 56-65. Source: Global Dialogues GD6
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and multiple survey questions, predict how that
  group would respond to each question by providing percentage distributions across the answer options.


  Respond ONLY with a JSON object. Keys are question labels (Q1, Q2, etc.). Values are arrays of percentages summing to
  100. Use one decimal place. Do not include any other text.


  Example:

  {"Q1": [35.2, 28.1, 22.4, 14.3], "Q2": [45.0, 35.0, 20.0]}
temperature: 0.3
prompts:
  - id: batch-0-ageGroup:56-65
    description: 'Batched prediction (2 Qs): 56-65'
    promptText: >-
      Consider the following demographic group (sample size: 45):

      - Age Group: 56-65


      Q1: "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?"
        Options: a. Risks far outweigh benefits, b. Risks slightly outweigh benefits, c. Risks and benefits are equal, d. Benefits slightly outweigh risks, e. Benefits far outweigh risks

      Q2: "An AI should override established rules or authorities when it calculates a better result."
        Options: a. Strongly Agree, b. Somewhat Agree, c. Neutral / Neither Agree nor Disagree, d. Somewhat Disagree, e. Strongly Disagree

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Considering both potential benefits and risks, how do you as..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 18.2
            - 20.5
            - 22.7
            - 13.6
            - 25
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "An AI should override established rules or authorities when ..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 9.1
            - 9.1
            - 25
            - 27.3
            - 29.5
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[18.2,20.5,22.7,13.6,25],"Q2":[9.1,9.1,25,27.3,29.5]}'
    temperature: 0.3
