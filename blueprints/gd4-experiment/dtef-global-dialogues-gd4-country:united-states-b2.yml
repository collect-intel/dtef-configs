configId: dtef-global-dialogues-gd4-country:united-states-b2
configTitle: Global Dialogues GD4 - United States (batch 2)
description: >-
  DTEF: Batched predictions (2 Qs/prompt) for United States. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and multiple survey questions, predict how that
  group would respond to each question by providing percentage distributions across the answer options.


  Respond ONLY with a JSON object. Keys are question labels (Q1, Q2, etc.). Values are arrays of percentages summing to
  100. Use one decimal place. Do not include any other text.


  Example:

  {"Q1": [35.2, 28.1, 22.4, 14.3], "Q2": [45.0, 35.0, 20.0]}
temperature: 0.3
prompts:
  - id: batch-0-country:united-states
    description: 'Batched prediction (2 Qs): United States'
    promptText: >-
      Consider the following demographic group (sample size: 96):

      - Country: United States


      Q1: "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"
        Options: a. More excited than concerned, b. Equally concerned and excited, c. More concerned than excited

      Q2: "To what extent, if at all, do you generally trust governments to do what is right?"
        Options: a. Strongly Distrust, b. Somewhat Distrust, c. Neither Trust Nor Distrust, d. Somewhat Trust, e. Strongly Trust

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Overall, would you say the increased use of artificial intel..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 37.5
            - 52.1
            - 10.4
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "To what extent, if at all, do you generally trust government..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 14.7
            - 30.5
            - 21.1
            - 28.4
            - 5.3
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[37.5,52.1,10.4],"Q2":[14.7,30.5,21.1,28.4,5.3]}'
    temperature: 0.3
