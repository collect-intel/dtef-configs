      unacceptable"; 9% more likely to choose "Neutral"; 8% less likely to choose "Somewhat acceptable"; 6% less likely
      to choose "Completely acceptable"

      On "A primary caregiver making personal decisions for an elderly person.": Tends toward "Somewhat unacceptable"
