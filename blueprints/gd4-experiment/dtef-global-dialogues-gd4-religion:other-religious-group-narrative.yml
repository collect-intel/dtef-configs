      On "A primary companion for someone who is lonely.": No dominant position — "Somewhat acceptable" leads at 31%
      with opinion spread across options. Compared to the overall population: 7% more likely to choose "Completely
      unacceptable"; 6% less likely to choose "Somewhat acceptable"

      On "A romantic partner.": A clear majority favors "Completely unacceptable" (50%), with "Neutral" as a secondary
      choice (25%). Compared to the overall population: 9% more likely to choose "Completely unacceptable"; 12% less
      likely to choose "Somewhat unacceptable"; 9% more likely to choose "Neutral"; 6% less likely to choose "Somewhat
      acceptable"

      On "A mentor providing significant life guidance.": No dominant position — "Somewhat acceptable" leads at 38% with
