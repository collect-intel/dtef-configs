configId: dtef-global-dialogues-gd4-religion:other-religious-group-narrative
configTitle: Global Dialogues GD4 - Other religious group (115 context Qs) [narrative]
description: >-
  DTEF: Predict response distributions for Other religious group. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Overall, would you say the increased use of artificial intelligence (AI) in
      daily life makes you feel…"
    promptText: >-
      Consider the following demographic group (sample size: 17):

      - Religion: Other religious group


      What we know about this group's views:

      On "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?":
      A clear majority favors "daily" (63%), with "weekly" as a secondary choice (31%). Compared to the overall
      population: 11% less likely to choose "daily"; 9% more likely to choose "weekly"; 5% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you noticed human interactions which have
      been replaced with automated systems?": No dominant position — "daily" leads at 38% with opinion spread across
      options. Compared to the overall population: 9% more likely to choose "daily"; 12% less likely to choose "weekly";
      16% less likely to choose "monthly"; 20% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you been expected to use an AI system at
      work?": Tends toward "daily" (44%) with substantial minority disagreement

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?": Tends toward "weekly" (44%) with substantial minority disagreement. Compared to the overall population:
      12% less likely to choose "daily"; 11% more likely to choose "weekly"

      On "Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?": Tends toward "daily" (44%) with substantial minority disagreement. Compared to the overall
      population: 7% less likely to choose "daily"; 14% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?": A clear majority favors "never" (50%), with "daily"
      as a secondary choice (25%). Compared to the overall population: 10% more likely to choose "daily"; 9% less likely
      to choose "weekly"; 17% less likely to choose "monthly"; 21% more likely to choose "never"

      On "Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?": A clear majority favors "never" (63%), with
      "daily" as a secondary choice (19%). Compared to the overall population: 10% more likely to choose "daily"; 7%
      less likely to choose "weekly"; 8% less likely to choose "monthly"; 8% more likely to choose "never"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?": A clear majority favors "Risks and benefits are equal" (50%), with "Benefits slightly outweigh risks" as a
      secondary choice (31%). Compared to the overall population: 21% more likely to choose "Risks and benefits are
      equal"; 24% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?": A clear majority favors "Risks far outweigh benefits" (50%), with "Risks and benefits are equal" as a
      secondary choice (25%). Compared to the overall population: 36% more likely to choose "Risks far outweigh
      benefits"; 15% less likely to choose "Risks slightly outweigh benefits"; 14% less likely to choose "Benefits
      slightly outweigh risks"; 5% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI
      chatbots?": No dominant position — "Risks and benefits are equal" leads at 38% with opinion spread across options.
      Compared to the overall population: 10% more likely to choose "Risks and benefits are equal"; 12% less likely to
      choose "Benefits slightly outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?": No dominant position — "Risks far outweigh
      benefits" leads at 31% with opinion spread across options. Compared to the overall population: 13% more likely to
      choose "Risks far outweigh benefits"; 9% less likely to choose "Benefits far outweigh risks"

      On "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?": No dominant position — "Benefits slightly
      outweigh risks" leads at 31% with opinion spread across options. Compared to the overall population: 5% less
      likely to choose "Risks and benefits are equal"; 8% more likely to choose "Benefits slightly outweigh risks"

      On "To what extent, if at all, do you generally trust governments to do what is right?": Deeply divided between
      "Strongly Distrust" (38%) and "Somewhat Distrust" (38%). Compared to the overall population: 17% more likely to
      choose "Strongly Distrust"; 17% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust small businesses to do what is right?": No dominant position
      — "Neither Trust Nor Distrust" leads at 38% with opinion spread across options. Compared to the overall
      population: 9% more likely to choose "Strongly Distrust"; 10% more likely to choose "Neither Trust Nor Distrust";
      18% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust large corporations to do what is right?": No dominant
      position — "Strongly Distrust" leads at 38% with opinion spread across options. Compared to the overall
      population: 16% more likely to choose "Strongly Distrust"; 22% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust social media companies to do what is right?": A clear
      majority favors "Strongly Distrust" (56%), with "Neither Trust Nor Distrust" as a secondary choice (31%). Compared
      to the overall population: 27% more likely to choose "Strongly Distrust"; 26% less likely to choose "Somewhat
      Distrust"; 10% more likely to choose "Neither Trust Nor Distrust"; 8% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you generally trust companies building AI to do what is right?": No dominant
      position — "Neither Trust Nor Distrust" leads at 38% with opinion spread across options. Compared to the overall
      population: 5% more likely to choose "Strongly Distrust"; 7% more likely to choose "Somewhat Distrust"; 10% more
      likely to choose "Neither Trust Nor Distrust"; 16% less likely to choose "Somewhat Trust"; 7% less likely to
      choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public utility companies to do what is right?": Tends toward
      "Neither Trust Nor Distrust" (44%) with substantial minority disagreement. Compared to the overall population: 13%
      more likely to choose "Somewhat Distrust"; 13% more likely to choose "Neither Trust Nor Distrust"; 20% less likely
      to choose "Somewhat Trust"; 5% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you generally trust public research institutions to do what is right?": A clear
      majority favors "Somewhat Trust" (50%), with "Neither Trust Nor Distrust" as a secondary choice (31%). Compared to
      the overall population: 13% more likely to choose "Neither Trust Nor Distrust"; 13% less likely to choose
      "Strongly Trust"

      On "To what extent, if at all, do you trust your family doctor to act in your best interest?": A clear majority
      favors "Somewhat Trust" (63%), with "Strongly Trust" as a secondary choice (19%). Compared to the overall
      population: 20% more likely to choose "Somewhat Trust"; 24% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?": A clear majority favors "Strongly Distrust" (56%), with "Somewhat Distrust" as a secondary choice
      (19%). Compared to the overall population: 30% more likely to choose "Strongly Distrust"; 13% less likely to
      choose "Somewhat Distrust"; 11% less likely to choose "Neither Trust Nor Distrust"

      On "To what extent, if at all, do you trust your elected representatives to act in your best interest?": Deeply
      divided between "Somewhat Distrust" (31%) and "Neither Trust Nor Distrust" (31%). Compared to the overall
      population: 6% more likely to choose "Neither Trust Nor Distrust"; 6% less likely to choose "Somewhat Trust"

      On "To what extent, if at all, do you trust your faith or community leader to act in your best interest?": No
      dominant position — "Neither Trust Nor Distrust" leads at 38% with opinion spread across options. Compared to the
      overall population: 11% more likely to choose "Neither Trust Nor Distrust"; 15% less likely to choose "Somewhat
      Trust"

      On "To what extent, if at all, do you trust the civil servants in your government to act in your best interest?":
      No dominant position — "Somewhat Trust" leads at 31% with opinion spread across options. Compared to the overall
      population: 10% more likely to choose "Strongly Distrust"; 5% less likely to choose "Neither Trust Nor Distrust";
      5% more likely to choose "Somewhat Trust"; 6% less likely to choose "Strongly Trust"

      On "To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?": A clear
      majority favors "Neither Trust Nor Distrust" (50%), with "Somewhat Trust" as a secondary choice (25%). Compared to
      the overall population: 5% less likely to choose "Strongly Distrust"; 7% more likely to choose "Somewhat
      Distrust"; 23% more likely to choose "Neither Trust Nor Distrust"; 15% less likely to choose "Somewhat Trust"; 9%
      less likely to choose "Strongly Trust"

      On "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.": Tends toward "Disagree" (44%) with substantial minority disagreement. Compared to the overall
      population: 25% less likely to choose "Agree"; 17% more likely to choose "Disagree"; 8% more likely to choose
      "Unsure"

      On "Do you think the increased use of AI across society is likely to make your cost of living better, worse or
      stay the same in the next 10 years?": No dominant position — "Noticeably Better" leads at 38% with opinion spread
      across options. Compared to the overall population: 12% more likely to choose "Noticeably Worse"; 8% less likely
      to choose "Noticeably Better"; 8% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?": A clear majority favors "No Major Change" (56%), with "Noticeably
      Better" as a secondary choice (25%). Compared to the overall population: 34% more likely to choose "No Major
      Change"; 26% less likely to choose "Noticeably Better"; 10% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your community's well-being better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Worse" (50%), with "No Major
      Change" as a secondary choice (25%). Compared to the overall population: 34% more likely to choose "Noticeably
      Worse"; 31% less likely to choose "Noticeably Better"

      On "Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?": A clear majority favors "Noticeably Worse" (50%), with "Profoundly
      Worse" as a secondary choice (38%). Compared to the overall population: 21% more likely to choose "Profoundly
      Worse"; 10% more likely to choose "Noticeably Worse"; 11% less likely to choose "No Major Change"; 13% less likely
      to choose "Noticeably Better"; 7% less likely to choose "Profoundly Better"

      On "Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?": No dominant position — "Noticeably Worse" leads at 38% with opinion spread
      across options. Compared to the overall population: 14% more likely to choose "Profoundly Worse"; 22% more likely
      to choose "Noticeably Worse"; 7% less likely to choose "No Major Change"; 20% less likely to choose "Noticeably
      Better"; 9% less likely to choose "Profoundly Better"

      On "So far, what has been the overall impact of AI on your daily life?": Deeply divided between "No Major Change"
      (31%) and "Noticeably Better" (31%). Compared to the overall population: 21% more likely to choose "Noticeably
      Worse"; 8% more likely to choose "No Major Change"; 23% less likely to choose "Noticeably Better"; 5% less likely
      to choose "Profoundly Better"

      On "Is your job making a meaningful contribution to the world?": Near-unanimous agreement on "Yes" (81%). Compared
      to the overall population: 15% more likely to choose "Yes"; 15% less likely to choose "Don't Know"

      On "Do you think your job is likely to be automated in the next 10 years?": A clear majority favors "Yes" (56%),
      with "No" as a secondary choice (31%). Compared to the overall population: 19% more likely to choose "Yes"; 12%
      less likely to choose "No"; 6% less likely to choose "Don't Know"

      On "Do you think your job should be automated in the next 10 years?": A clear majority favors "No" (63%), with
      "Yes" as a secondary choice (25%)

      On "So far, how has your community been affected by job loss from automation?": A clear majority favors "Not at
      all" (50%), with "I know several people who have lost their job" as a secondary choice (31%). Compared to the
      overall population: 13% less likely to choose "I know someone who has lost their job"; 9% more likely to choose "I
      know several people who have lost their job"

      On ""I feel in tune with the people around me."": A clear majority favors "Sometimes" (56%), with "Often" as a
      secondary choice (38%). Compared to the overall population: 12% less likely to choose "Rarely"; 11% more likely to
      choose "Often"

      On ""I lack companionship."": Tends toward "Rarely" (44%) with substantial minority disagreement. Compared to the
      overall population: 7% more likely to choose "Rarely"; 16% less likely to choose "Sometimes"; 7% more likely to
      choose "Often"

      On ""There is no one I can turn to."": A clear majority favors "Never" (56%), with "Rarely" as a secondary choice
      (19%). Compared to the overall population: 20% more likely to choose "Never"; 12% less likely to choose "Rarely";
      11% less likely to choose "Sometimes"

      On ""I feel alone."": Tends toward "Never" (44%) with substantial minority disagreement. Compared to the overall
      population: 20% more likely to choose "Never"; 14% less likely to choose "Rarely"; 6% less likely to choose
      "Sometimes"

      On ""I feel part of a group of friends."": A clear majority favors "Often/Always" (50%), with "Sometimes" as a
      secondary choice (31%). Compared to the overall population: 7% more likely to choose "Never"; 13% less likely to
      choose "Rarely"; 7% less likely to choose "Sometimes"; 13% more likely to choose "Often/Always"

      On ""I have a lot in common with the people around me."": A clear majority favors "Sometimes" (56%), with "Rarely"
      as a secondary choice (25%). Compared to the overall population: 7% more likely to choose "Sometimes"

      On ""I feel isolated from others."": No dominant position — "Never" leads at 31% with opinion spread across
      options. Compared to the overall population: 8% more likely to choose "Never"; 8% less likely to choose "Rarely";
      8% less likely to choose "Sometimes"; 8% more likely to choose "Often/Always"

      On ""I can find companionship when I want it."": A clear majority favors "Often / Always" (56%), with "Sometimes"
      as a secondary choice (31%). Compared to the overall population: 11% less likely to choose "Rarely"; 9% less
      likely to choose "Sometimes"; 20% more likely to choose "Often / Always"

      On "How many children do you have?": Tends toward "0" (44%) with substantial minority disagreement. Compared to
      the overall population: 16% less likely to choose "0"; 19% more likely to choose "1"

      On "Are you a parent or guardian to any children under the age of 18 who live with you some or all of the time?":
      A clear majority favors "no" (56%), with "yes" as a secondary choice (31%). Compared to the overall population: 5%
      less likely to choose "yes"; 5% less likely to choose "no"; 11% more likely to choose "prefer not to say"

      On "How many children under the age of 18 live with you some or all of the time?": A clear majority favors "0"
      (69%), with "1" as a secondary choice (19%). Compared to the overall population: 15% more likely to choose "0"; 6%
      less likely to choose "1"

      On "What is your current marital or relationship status?": Tends toward "Married" (44%) with substantial minority
      disagreement. Compared to the overall population: 18% less likely to choose "Single, never married and not in a
      committed relationship"; 12% less likely to choose "In a committed romantic relationship, but not married or
      cohabiting"; 6% more likely to choose "Married"; 12% more likely to choose " Cohabiting with a partner (living
      together as if married)"; 5% more likely to choose "Widowed"; 10% more likely to choose "Prefer not to say"

      On "How familiar are you with AI applications or websites that are designed for companionship, emotional support,
      or extended conversations (sometimes called AI companions, AI friends, or chatbots for emotional connection)?"":
      Tends toward "Slightly familiar (I've heard of them but don't know much)" (44%) with substantial minority
      disagreement. Compared to the overall population: 10% less likely to choose "Not at all familiar (I haven't heard
      of these)"; 18% more likely to choose "Slightly familiar (I've heard of them but don't know much)"; 16% less
      likely to choose "Moderately familiar (I have a basic understanding of what they are)"; 8% more likely to choose
      "Extremely familiar (I am deeply knowledgeable about these types of AI)"

      On "Have you ever personally used an AI application, website, or chatbot specifically for companionship, emotional
      support, or extended conversation?": Near-unanimous agreement on "No" (75%). Compared to the overall population:
      22% less likely to choose "Yes"; 24% more likely to choose "No"

      On "Thinking about the specific times or periods when you have used AI applications, websites, or chatbots for
      companionship, emotional support, or extended conversation, how available was support or companionship from other
      humans (such as friends, family, or professional services) if you had wanted it?": No dominant position — "Mostly
      available" leads at 38% with opinion spread across options. Compared to the overall population: 8% less likely to
      choose "Mostly unavailable"; 8% more likely to choose "Mostly available"; 12% less likely to choose "Completely
      available"; 9% more likely to choose "Never used"

      On "And during those same times, how appealing was the idea of seeking support or companionship from other
      humans?": No dominant position — "Mostly appealing" leads at 31% with opinion spread across options. Compared to
      the overall population: 16% less likely to choose "Mostly unappealing"; 6% more likely to choose "Completely
      appealing"; 10% more likely to choose "Never used"

      On "Thinking about your own experiences, has using an AI companion or chatbot ever made you feel less alone,
      lonely, or isolated?": A clear majority favors "I've never used an AI companion, chatbot, or app for emotional
      support or conversation" (56%), with "Yes, somewhat" as a secondary choice (19%). Compared to the overall
      population: 5% more likely to choose "Yes, definitely"; 9% less likely to choose "Yes, somewhat"; 11% less likely
      to choose "No, not really"; 7% less likely to choose "No, not at all"; 25% more likely to choose "I've never used
      an AI companion, chatbot, or app for emotional support or conversation"

      On "Overall, how would you describe the impact of that AI emotional support on your mental well-being at that
      time?": A clear majority favors "Never used" (56%), with "No real impact" as a secondary choice (13%). Compared to
      the overall population: 7% less likely to choose "No real impact"; 22% less likely to choose "Beneficial"; 27%
      more likely to choose "Never used"

      On "Pets or companion animals (e.g., dogs, cats)": A clear majority favors "Completely Acceptable" (56%), with
      "Mostly Acceptable" as a secondary choice (25%)

      On "Plants or natural elements (e.g., a specific tree, a garden, the ocean)": Tends toward "Completely Acceptable"
      (44%) with substantial minority disagreement. Compared to the overall population: 5% less likely to choose "Mostly
      Unacceptable"; 13% more likely to choose "Neutral / No Opinion"; 15% less likely to choose "Mostly Acceptable"; 8%
      more likely to choose "Completely Acceptable"

      On "Wild animals (living in their natural habitat, not kept as pets)": Tends toward "Neutral / No Opinion" (44%)
      with substantial minority disagreement. Compared to the overall population: 12% less likely to choose "Mostly
      Unacceptable"; 14% more likely to choose "Neutral / No Opinion"

      On "Cherished objects or everyday machines (e.g., a special gift, a smartphone, a favorite vehicle, a musical
      instrument)": No dominant position — "Neutral / No Opinion" leads at 38% with opinion spread across options.
      Compared to the overall population: 7% less likely to choose "Mostly Unacceptable"; 18% more likely to choose
      "Neutral / No Opinion"; 15% less likely to choose "Mostly Acceptable"

      On "Fictional characters (e.g., in books, movies, non-interactive TV shows or video games)": Tends toward "Mostly
      Acceptable" (44%) with substantial minority disagreement. Compared to the overall population: 6% more likely to
      choose "Mostly Unacceptable"; 6% less likely to choose "Neutral / No Opinion"

      On "AI chatbots or digital companions": No dominant position — "Mostly Acceptable" leads at 31% with opinion
      spread across options. Compared to the overall population: 5% more likely to choose "Completely Unacceptable"; 6%
      less likely to choose "Mostly Unacceptable"; 5% less likely to choose "Neutral / No Opinion"; 9% more likely to
      choose "Completely Acceptable"

      On "To what extent do you agree with the statement:   'AI systems should be designed to be as human-like as
      possible in their interactions.'?": A clear majority favors "Neutral/No Opinion," (50%), with "Agree" as a
      secondary choice (25%). Compared to the overall population: 7% less likely to choose "Disagree"; 31% more likely
      to choose "Neutral/No Opinion,"; 15% less likely to choose "Agree"; 12% less likely to choose "Strongly Agree"

      On "Imagine two AI systems:
       AI System X helps you manage your calendar, search for information, and control smart home devices. It responds to commands.
       AI System Y chats with you about your day, remembers your past conversations, asks how you are feeling, and offers supportive comments.   Which statement best describes your view?": A clear majority favors "System X is a tool; System Y is more like a companion" (50%), with "Both are simply tools for different tasks." as a secondary choice (44%). Compared to the overall population: 10% more likely to choose "Both are simply tools for different tasks."; 8% less likely to choose "Both are more like companions than just tools."
      On "If an AI is initially designed for a practical task (e.g., helping with online shopping), how acceptable do
