configId: dtef-global-dialogues-gd7-environment:suburban-b2
configTitle: Global Dialogues GD7 - Suburban (batch 2)
description: >-
  DTEF: Batched predictions (2 Qs/prompt) for Suburban. Source: Global Dialogues GD7
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and multiple survey questions, predict how that
  group would respond to each question by providing percentage distributions across the answer options.


  Respond ONLY with a JSON object. Keys are question labels (Q1, Q2, etc.). Values are arrays of percentages summing to
  100. Use one decimal place. Do not include any other text.


  Example:

  {"Q1": [35.2, 28.1, 22.4, 14.3], "Q2": [45.0, 35.0, 20.0]}
temperature: 0.3
prompts:
  - id: batch-0-environment:suburban
    description: 'Batched prediction (2 Qs): Suburban'
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Q1: "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."
        Options: a. Agree, b. Disagree, c. Unsure

      Q2: "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?"
        Options: a. Risks far outweigh benefits, b. Risks slightly outweigh benefits, c. Risks and benefits are equal, d. Benefits slightly outweigh risks, e. Benefits far outweigh risks

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Do you agree or disagree with this statement? AI could make ..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 36.4
            - 29.5
            - 34.1
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "Considering both potential benefits and risks, how do you as..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 20
            - 26
            - 21.1
            - 22.6
            - 10.2
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[36.4,29.5,34.1],"Q2":[20,26,21.1,22.6,10.2]}'
    temperature: 0.3
  - id: batch-1-environment:suburban
    description: 'Batched prediction (2 Qs): Suburban'
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Q1: "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?"
        Options: a. Risks far outweigh benefits, b. Risks slightly outweigh benefits, c. Risks and benefits are equal, d. Benefits slightly outweigh risks, e. Benefits far outweigh risks

      Q2: "To what extent, if at all, do you generally trust governments to do what is right?"
        Options: a. Strongly Distrust, b. Somewhat Distrust, c. Neither Trust Nor Distrust, d. Somewhat Trust, e. Strongly Trust

      For each question, predict the percentage distribution of responses for this demographic group across the answer
      options.
    points:
      - text: 'Distribution Similarity Q1: "Considering both potential benefits and risks, how do you as..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.5
            - 26.8
            - 25.7
            - 15.8
            - 10.2
          metric: js-divergence
          questionKey: Q1
      - text: 'Distribution Similarity Q2: "To what extent, if at all, do you generally trust government..."'
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.9
            - 35.5
            - 17.4
            - 21.9
            - 3.4
          metric: js-divergence
          questionKey: Q2
    idealResponse: '{"Q1":[21.5,26.8,25.7,15.8,10.2],"Q2":[21.9,35.5,17.4,21.9,3.4]}'
    temperature: 0.3
