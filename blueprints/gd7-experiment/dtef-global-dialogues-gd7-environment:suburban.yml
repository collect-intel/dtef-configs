            - 44.7
            - 23.9
            - 6.1
          metric: js-divergence
    idealResponse: '[5.3, 20.1, 44.7, 23.9, 6.1]'
    temperature: 0.3
  - id: a2f84060-18d0-465c-960a-8f8a925e1be1-environment:suburban
    description: >-
      Predict: Suburban → "Considering both potential benefits and risks, how do you assess the overall impact on
      society of social media apps?"
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of social media
