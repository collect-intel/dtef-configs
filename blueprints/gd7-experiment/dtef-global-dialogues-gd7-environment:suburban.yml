      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 18.1
            - 25.3
            - 30.2
            - 20
            - 6.4
          metric: js-divergence
    idealResponse: '[18.1, 25.3, 30.2, 20.0, 6.4]'
    temperature: 0.3
  - id: 92d647b9-d902-47bc-b2b3-b2871725ebfe-environment:suburban
    description: >-
      Predict: Suburban → "Do you think the increased use of AI across society is likely to make the availability of
      good jobs better, worse or stay the same in the next 10 years?"
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Survey question:

      "Do you think the increased use of AI across society is likely to make the availability of good jobs better, worse
