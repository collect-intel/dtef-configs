configId: dtef-global-dialogues-gd7-environment:suburban
configTitle: Global Dialogues GD7 - Suburban
description: >-
  DTEF: Predict response distributions for Suburban. Source: Global Dialogues GD7
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 3715e9a1-f652-48be-8a15-7a9deb802a1b-environment:suburban
    description: >-
      Predict: Suburban → "Do you agree or disagree with this statement? AI could make better decisions on my behalf
      than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 36.4
            - 29.5
            - 34.1
          metric: js-divergence
    idealResponse: '[36.4, 29.5, 34.1]'
    temperature: 0.3
  - id: 49d3ba6e-1281-4f74-aef7-4e55cf11ebb0-environment:suburban
    description: >-
      Predict: Suburban → "Considering both potential benefits and risks, how do you assess the overall impact on
      society of AI systems that can outperform humans on most economically valuable work?"
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can outperform humans on most economically valuable work?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 20
            - 26
            - 21.1
            - 22.6
            - 10.2
          metric: js-divergence
    idealResponse: '[20.0, 26.0, 21.1, 22.6, 10.2]'
    temperature: 0.3
  - id: 03ac572b-962e-4f24-a48b-cbbd6f2acd20-environment:suburban
    description: >-
      Predict: Suburban → "Considering both potential benefits and risks, how do you assess the overall impact on
      society of AI systems that can perform tasks in the real world without human supervision?"
    promptText: >-
      Consider the following demographic group (sample size: 267):

      - Environment: Suburban


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems that
      can perform tasks in the real world without human supervision?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.5
            - 26.8
            - 25.7
            - 15.8
            - 10.2
          metric: js-divergence
    idealResponse: '[21.5, 26.8, 25.7, 15.8, 10.2]'
    temperature: 0.3
  - id: 733aae0e-2178-4d6a-a853-16e6ead10472-environment:suburban
    description: 'Predict: Suburban → "To what extent, if at all, do you generally trust governments to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 267):
      - Environment: Suburban

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.9
            - 35.5
            - 17.4
            - 21.9
            - 3.4
          metric: js-divergence
    idealResponse: '[21.9, 35.5, 17.4, 21.9, 3.4]'
    temperature: 0.3
  - id: 584716af-7504-49c9-b2c1-abae12db8872-environment:suburban
    description: 'Predict: Suburban → "To what extent, if at all, do you generally trust large corporations to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 267):
      - Environment: Suburban

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 27.5
            - 30.6
            - 18.9
            - 16.6
            - 6.4
          metric: js-divergence
    idealResponse: '[27.5, 30.6, 18.9, 16.6, 6.4]'
    temperature: 0.3
  - id: 5fc690be-1f15-4c00-be3f-48d5e327eab0-environment:suburban
    description: 'Predict: Suburban → "To what extent, if at all, do you generally trust companies building AI to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 267):
      - Environment: Suburban

