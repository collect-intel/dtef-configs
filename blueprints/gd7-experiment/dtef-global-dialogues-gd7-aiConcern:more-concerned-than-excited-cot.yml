          metric: js-divergence
    idealResponse: '[57.0, 23.7, 14.1, 3.0, 2.2]'
    temperature: 0.3
  - id: 733aae0e-2178-4d6a-a853-16e6ead10472-aiConcern:more-concerned-than-excited
    description: >-
      Predict: More concerned than excited → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 140):
      - Ai Concern: More concerned than excited

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
