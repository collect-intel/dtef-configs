  - id: e5d7cc7b-d2cc-4b34-9c25-af67f8b7b83c-religion:christianity
    description: >-
      Predict: Christianity → "Do you agree or disagree with this statement? AI could make better decisions on my behalf
      than my government representatives."
    promptText: >-
      Consider the following demographic group (sample size: 347):

      - Religion: Christianity


      Survey question:

      "Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives."


      Answer options:
        a. Agree
        b. Disagree
        c. Unsure

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 50.4
            - 20.2
            - 29.4
          metric: js-divergence
    idealResponse: '[50.4, 20.2, 29.4]'
    temperature: 0.3
  - id: 29598fc6-6928-49f7-9a42-2f57cf5e1c28-religion:christianity
    description: >-
      Predict: Christianity → "Considering both potential benefits and risks, how do you assess the overall impact on
