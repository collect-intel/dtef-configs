    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-religion:christianity
    description: >-
      Predict: Christianity → "Considering both potential benefits and risks, how do you assess the overall impact on
      society of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 347):

      - Religion: Christianity


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 4.1
            - 10.5
            - 24.9
            - 33
            - 27.5
          metric: js-divergence
    idealResponse: '[4.1, 10.5, 24.9, 33.0, 27.5]'
    temperature: 0.3
  - id: cc7346fb-571e-48ad-aeaa-4135f0fdf58c-religion:christianity
    description: 'Predict: Christianity → "A romantic partner."'
