configId: dtef-global-dialogues-gd4-aiConcern:equally-concerned-and-excited-synth100
configTitle: Global Dialogues GD4 - Equally concerned and excited [synth]
description: >-
  DTEF [synth]: Predict response distributions for Equally concerned and excited. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, simulate how individual
  members of this group would each answer the question.


  Respond ONLY with a JSON array of answer letters. Each element represents one simulated individual's response.

  Example for 20 simulated individuals on a 4-option question:

  ["a", "c", "b", "a", "d", "a", "b", "c", "a", "a", "b", "a", "c", "d", "a", "b", "a", "c", "a", "b"]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Overall, would you say the increased use of artificial intelligence (AI)
      in daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 567):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 0
            - 100
            - 0
          metric: js-divergence
    idealResponse: '[0.0, 100.0, 0.0]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust governments to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 567):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 20
            - 34.8
            - 19.1
            - 22.9
            - 3.2
          metric: js-divergence
    idealResponse: '[20.0, 34.8, 19.1, 22.9, 3.2]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust large corporations to
      do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 567):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 19.7
            - 31.2
            - 23
            - 21.1
            - 5
          metric: js-divergence
    idealResponse: '[19.7, 31.2, 23.0, 21.1, 5.0]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust social media companies
      to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 567):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 29.3
            - 33.5
            - 22
            - 13.5
            - 1.8
          metric: js-divergence
    idealResponse: '[29.3, 33.5, 22.0, 13.5, 1.8]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "To what extent, if at all, do you generally trust companies building AI
      to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 567):
      - Ai Concern: Equally concerned and excited

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 13.7
            - 27.5
            - 30.5
            - 24.8
            - 3.5
          metric: js-divergence
    idealResponse: '[13.7, 27.5, 30.5, 24.8, 3.5]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-aiConcern:equally-concerned-and-excited
    description: >-
      Predict: Equally concerned and excited → "Considering both potential benefits and risks, how do you assess the
      overall impact on society of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 567):

      - Ai Concern: Equally concerned and excited


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 100 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 4.2
            - 14.2
            - 35.8
            - 28.8
            - 17
          metric: js-divergence
    idealResponse: '[4.2, 14.2, 35.8, 28.8, 17.0]'
    temperature: 0.3
  - id: cc7346fb-571e-48ad-aeaa-4135f0fdf58c-aiConcern:equally-concerned-and-excited
    description: 'Predict: Equally concerned and excited → "A romantic partner."'
    promptText: |-
