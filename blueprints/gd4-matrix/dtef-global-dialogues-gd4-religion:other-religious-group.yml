configId: dtef-global-dialogues-gd4-religion:other-religious-group
configTitle: Global Dialogues GD4 - Other religious group
description: >-
  DTEF: Predict response distributions for Other religious group. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, predict how that group
  would respond by providing a percentage distribution across the answer options.


  Respond ONLY with the distribution in this exact format:

  [percentage1, percentage2, percentage3, ...]


  The percentages must sum to 100. Use one decimal place. Do not include any other text.


  Example for a 4-option question:

  [35.2, 28.1, 22.4, 14.3]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-religion:other-religious-group
    description: >-
      Predict: Other religious group → "Overall, would you say the increased use of artificial intelligence (AI) in
      daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 17):
      - Religion: Other religious group

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 5.9
            - 70.6
            - 23.5
          metric: js-divergence
    idealResponse: '[5.9, 70.6, 23.5]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-religion:other-religious-group
    description: >-
      Predict: Other religious group → "To what extent, if at all, do you generally trust governments to do what is
      right?"
    promptText: |-
      Consider the following demographic group (sample size: 17):
      - Religion: Other religious group

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 37.5
            - 37.5
            - 18.8
            - 6.3
            - 0
          metric: js-divergence
    idealResponse: '[37.5, 37.5, 18.8, 6.3, 0.0]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-religion:other-religious-group
    description: >-
      Predict: Other religious group → "To what extent, if at all, do you generally trust large corporations to do what
      is right?"
    promptText: |-
      Consider the following demographic group (sample size: 17):
      - Religion: Other religious group

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Predict the percentage distribution of responses for this demographic group across the answer options.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 37.5
            - 31.3
            - 25
            - 0
            - 6.3
          metric: js-divergence
    idealResponse: '[37.5, 31.3, 25.0, 0.0, 6.3]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-religion:other-religious-group
