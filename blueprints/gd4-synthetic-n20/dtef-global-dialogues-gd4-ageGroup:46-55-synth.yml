          metric: js-divergence
    idealResponse: '[6.2, 20.6, 27.8, 38.1, 7.2]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-ageGroup:46-55
    description: >-
      Predict: 46-55 → "Considering both potential benefits and risks, how do you assess the overall impact on society
      of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 99):

      - Age Group: 46-55


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 6.2
            - 5.2
            - 37.1
            - 27.8
            - 23.7
          metric: js-divergence
    idealResponse: '[6.2, 5.2, 37.1, 27.8, 23.7]'
    temperature: 0.3
  - id: cc7346fb-571e-48ad-aeaa-4135f0fdf58c-ageGroup:46-55
