configId: dtef-global-dialogues-gd4-ageGroup:46-55-synth
configTitle: Global Dialogues GD4 - 46-55 [synth]
description: >-
  DTEF [synth]: Predict response distributions for 46-55. Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, simulate how individual
  members of this group would each answer the question.


  Respond ONLY with a JSON array of answer letters. Each element represents one simulated individual's response.

  Example for 20 simulated individuals on a 4-option question:

  ["a", "c", "b", "a", "d", "a", "b", "c", "a", "a", "b", "a", "c", "d", "a", "b", "a", "c", "a", "b"]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-ageGroup:46-55
    description: >-
      Predict: 46-55 → "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you
      feel…"
    promptText: |-
      Consider the following demographic group (sample size: 99):
      - Age Group: 46-55

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 44.4
            - 44.4
            - 11.1
          metric: js-divergence
    idealResponse: '[44.4, 44.4, 11.1]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-ageGroup:46-55
    description: 'Predict: 46-55 → "To what extent, if at all, do you generally trust governments to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 99):
      - Age Group: 46-55

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 15.5
            - 30.9
            - 20.6
            - 24.7
            - 8.2
          metric: js-divergence
    idealResponse: '[15.5, 30.9, 20.6, 24.7, 8.2]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-ageGroup:46-55
    description: 'Predict: 46-55 → "To what extent, if at all, do you generally trust large corporations to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 99):
      - Age Group: 46-55

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 13.4
            - 33
            - 22.7
            - 28.9
            - 2.1
          metric: js-divergence
    idealResponse: '[13.4, 33.0, 22.7, 28.9, 2.1]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-ageGroup:46-55
    description: 'Predict: 46-55 → "To what extent, if at all, do you generally trust social media companies to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 99):
      - Age Group: 46-55

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 21.6
            - 29.9
            - 22.7
            - 21.6
            - 4.1
          metric: js-divergence
    idealResponse: '[21.6, 29.9, 22.7, 21.6, 4.1]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-ageGroup:46-55
    description: 'Predict: 46-55 → "To what extent, if at all, do you generally trust companies building AI to do what is right?"'
    promptText: |-
      Consider the following demographic group (sample size: 99):
      - Age Group: 46-55

      Survey question:
      "To what extent, if at all, do you generally trust companies building AI to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
