            - 1.3
          metric: js-divergence
    idealResponse: '[19.8, 28.9, 28.9, 21.1, 1.3]'
    temperature: 0.3
  - id: 6630ff34-e67e-423a-9cea-0a4861106680-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Considering both potential benefits and risks, how
      do you assess the overall impact on society of messaging apps?"
    promptText: >-
      Consider the following demographic group (sample size: 324):

      - Religion: I do not identify with any religious group or faith


      Survey question:

      "Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?"


      Answer options:
        a. Risks far outweigh benefits
        b. Risks slightly outweigh benefits
        c. Risks and benefits are equal
        d. Benefits slightly outweigh risks
        e. Benefits far outweigh risks

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 5.3
            - 9.4
            - 27
            - 32.7
            - 25.5
          metric: js-divergence
    idealResponse: '[5.3, 9.4, 27.0, 32.7, 25.5]'
    temperature: 0.3
