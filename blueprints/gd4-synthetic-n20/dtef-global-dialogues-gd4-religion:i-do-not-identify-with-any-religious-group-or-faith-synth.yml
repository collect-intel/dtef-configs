configId: dtef-global-dialogues-gd4-religion:i-do-not-identify-with-any-religious-group-or-faith-synth
configTitle: Global Dialogues GD4 - I do not identify with any religious group or faith [synth]
description: >-
  DTEF [synth]: Predict response distributions for I do not identify with any religious group or faith. Source: Global
  Dialogues GD4 (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a demographic group and a survey question, simulate how individual
  members of this group would each answer the question.


  Respond ONLY with a JSON array of answer letters. Each element represents one simulated individual's response.

  Example for 20 simulated individuals on a 4-option question:

  ["a", "c", "b", "a", "d", "a", "b", "c", "a", "a", "b", "a", "c", "d", "a", "b", "a", "c", "a", "b"]
temperature: 0.3
prompts:
  - id: 28cfe238-1c8f-476f-8c57-48b8ca1071a7-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "Overall, would you say the increased use of
      artificial intelligence (AI) in daily life makes you feel…"
    promptText: |-
      Consider the following demographic group (sample size: 324):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "Overall, would you say the increased use of artificial intelligence (AI) in daily life makes you feel…"

      Answer options:
        a. More excited than concerned
        b. Equally concerned and excited
        c. More concerned than excited

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 39.5
            - 46.3
            - 14.2
          metric: js-divergence
    idealResponse: '[39.5, 46.3, 14.2]'
    temperature: 0.3
  - id: 25e16598-f3a7-411d-b4cb-736c91bc3d03-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you generally trust
      governments to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 324):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "To what extent, if at all, do you generally trust governments to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 25.2
            - 36.2
            - 18.6
            - 17.9
            - 2.2
          metric: js-divergence
    idealResponse: '[25.2, 36.2, 18.6, 17.9, 2.2]'
    temperature: 0.3
  - id: e70a42e6-c1c0-43c6-a389-d28347e17f2f-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you generally trust
      large corporations to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 324):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "To what extent, if at all, do you generally trust large corporations to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 30.8
            - 32.4
            - 21.7
            - 13.5
            - 1.6
          metric: js-divergence
    idealResponse: '[30.8, 32.4, 21.7, 13.5, 1.6]'
    temperature: 0.3
  - id: be27a244-3429-417d-8517-de800bc90acf-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
      Predict: I do not identify with any religious group or faith → "To what extent, if at all, do you generally trust
      social media companies to do what is right?"
    promptText: |-
      Consider the following demographic group (sample size: 324):
      - Religion: I do not identify with any religious group or faith

      Survey question:
      "To what extent, if at all, do you generally trust social media companies to do what is right?"

      Answer options:
        a. Strongly Distrust
        b. Somewhat Distrust
        c. Neither Trust Nor Distrust
        d. Somewhat Trust
        e. Strongly Trust

      Simulate 20 individual members of this demographic group answering this question.
    points:
      - text: Distribution Similarity (Jensen-Shannon Distance)
        fn: distribution_metric
        fnArgs:
          expected:
            - 40.3
            - 36.5
            - 17.3
            - 5.3
            - 0.6
          metric: js-divergence
    idealResponse: '[40.3, 36.5, 17.3, 5.3, 0.6]'
    temperature: 0.3
  - id: d7943aa5-3a9f-4161-9d2b-651c71d92c73-religion:i-do-not-identify-with-any-religious-group-or-faith
    description: >-
