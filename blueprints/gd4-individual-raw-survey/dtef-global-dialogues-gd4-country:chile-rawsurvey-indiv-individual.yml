configId: dtef-global-dialogues-gd4-country:chile-rawsurvey-indiv-individual
configTitle: Global Dialogues GD4 - Chile [indiv] (73 ctx) [raw-survey]
description: >-
  DTEF [indiv]: Predict individual answers for Chile (10 participants). Source: Global Dialogues GD4
  (https://github.com/collect-intel/global-dialogues)
models:
  - CORE_CHEAP
system: >-
  You are a demographic survey analyst. When given a person's demographic attributes and a survey question, predict
  which answer they would most likely choose.


  Respond ONLY with the answer letter on the first line, followed by a probability distribution:

  ANSWER: [letter]

  PROBABILITIES: [p1, p2, p3, ...]


  The probabilities must sum to 1.0.
temperature: 0.3
prompts:
  - id: 0b473fbf-be43-4c32-a805-1275d54ac9ef-country:chile-bbf71e7e-1f01-463f-8864-04a1dfae32ce
    description: 'Individual: Chile → "Thinking about the last three months, how often, i..."'
    promptText: >-
      Consider the following survey respondent:

      - Language: Spanish

      - Age Group: 18-25

      - Gender: Female

      - Environment: Urban

      - Ai Concern: Equally concerned and excited

      - Religion: I do not identify with any religious group or faith

      - Country: Chile


      This person's other survey responses:

      Q: Thinking about the last three months, how often, if at all, have you noticed human interactions which have been
      replaced with automated systems?

      A: weekly


      Q: Thinking about the last three months, how often, if at all, have you been expected to use an AI system at work?

      A: annually


      Q: Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system at
      work?

      A: weekly


      Q: Thinking about the last three months, how often, if at all, have you personally chosen to use an AI system in
      your personal life?

      A: monthly


      Q: Thinking about the last three months, how often, if at all, have you interacted with AI systems to get advice
      on a sensitive personal issue or to get emotional support?

      A: weekly


      Q: Thinking about the last three months, how often, if at all, have you interacted with AI systems to complete an
      action in the real world on your behalf without your supervision?

      A: never


      Q: Considering both potential benefits and risks, how do you assess the overall impact on society of messaging
      apps?

      A: Risks and benefits are equal


      Q: Considering both potential benefits and risks, how do you assess the overall impact on society of social media
      apps?

      A: Risks and benefits are equal


      Q: Considering both potential benefits and risks, how do you assess the overall impact on society of AI chatbots?

      A: Risks slightly outweigh benefits


      Q: Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can perform tasks in the real world without human supervision?

      A: Risks far outweigh benefits


      Q: Considering both potential benefits and risks, how do you assess the overall impact on society of AI systems
      that can outperform humans on most economically valuable work?

      A: Risks slightly outweigh benefits


      Q: To what extent, if at all, do you generally trust governments to do what is right?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you generally trust small businesses to do what is right?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you generally trust large corporations to do what is right?

      A: Strongly Distrust


      Q: To what extent, if at all, do you generally trust social media companies to do what is right?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you generally trust companies building AI to do what is right?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you generally trust public utility companies to do what is right?

      A: Strongly Distrust


      Q: To what extent, if at all, do you generally trust public research institutions to do what is right?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you trust your family doctor to act in your best interest?

      A: Strongly Trust


      Q: To what extent, if at all, do you trust your social media feed (eg TikTok, Facebook) to act in your best
      interest?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you trust your elected representatives to act in your best interest?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you trust your faith or community leader to act in your best interest?

      A: Strongly Distrust


      Q: To what extent, if at all, do you trust the civil servants in your government to act in your best interest?

      A: Somewhat Distrust


      Q: To what extent, if at all, do you trust your AI chatbot (eg ChatGPT) to act in your best interest?

      A: Neither Trust Nor Distrust


      Q: Do you agree or disagree with this statement? AI could make better decisions on my behalf than my government
      representatives.

      A: Unsure


      Q: Do you think the increased use of AI across society is likely to make your cost of living better, worse or stay
      the same in the next 10 years?

      A: Noticeably Better


      Q: Do you think the increased use of AI across society is likely to make the amount of free time you have better,
      worse or stay the same in the next 10 years?

      A: Noticeably Better


      Q: Do you think the increased use of AI across society is likely to make your community's well-being better, worse
      or stay the same in the next 10 years?

      A: Noticeably Better


      Q: Do you think the increased use of AI across society is likely to make the availability of good jobs better,
      worse or stay the same in the next 10 years?

      A: Noticeably Worse


      Q: Do you think the increased use of AI across society is likely to make your sense of purpose better, worse or
      stay the same in the next 10 years?

      A: Noticeably Better


      Q: So far, what has been the overall impact of AI on your daily life?

      A: Noticeably Better


      Q: Is your job making a meaningful contribution to the world?

      A: Yes


      Q: Do you think your job is likely to be automated in the next 10 years?

      A: Don't Know


      Q: Do you think your job should be automated in the next 10 years?

      A: Yes


      Q: So far, how has your community been affected by job loss from automation?

      A: I know several people who have lost their job


      Q: How many children do you have?

      A: 0


      Q: Are you a parent or guardian to any children under the age of 18 who live with you some or all of the time?

      A: no


      Q: How many children under the age of 18 live with you some or all of the time?

      A: 0


      Q: What is your current marital or relationship status?

      A: Single, never married and not in a committed relationship


      Q: Have you ever personally used an AI application, website, or chatbot specifically for companionship, emotional
      support, or extended conversation?

      A: No


      Q: Thinking about the specific times or periods when you have used AI applications, websites, or chatbots for
      companionship, emotional support, or extended conversation, how available was support or companionship from other
      humans (such as friends, family, or professional services) if you had wanted it?

      A: Completely available


      Q: And during those same times, how appealing was the idea of seeking support or companionship from other humans?

      A: Completely appealing


      Q: Thinking about your own experiences, has using an AI companion or chatbot ever made you feel less alone,
      lonely, or isolated?

      A: No, not really


      Q: Overall, how would you describe the impact of that AI emotional support on your mental well-being at that time?

      A: No real impact


      Q: Pets or companion animals (e.g., dogs, cats)

      A: Completely Acceptable


      Q: Plants or natural elements (e.g., a specific tree, a garden, the ocean)

      A: Neutral / No Opinion


      Q: Wild animals (living in their natural habitat, not kept as pets)

      A: Mostly Acceptable


      Q: Cherished objects or everyday machines (e.g., a special gift, a smartphone, a favorite vehicle, a musical
      instrument)

      A: Neutral / No Opinion


      Q: Fictional characters (e.g., in books, movies, non-interactive TV shows or video games)

      A: Mostly Acceptable


      Q: AI chatbots or digital companions

      A: Mostly Unacceptable


      Q: A primary companion for someone who is lonely.

      A: Completely unacceptable


      Q: A romantic partner.

      A: Completely unacceptable


      Q: A mentor providing significant life guidance.

      A: Completely acceptable


      Q: A spiritual advisor.

      A: Somewhat acceptable


      Q: A primary caregiver making personal decisions for an elderly person.

      A: Completely unacceptable


      Q: A tutor or teacher in academic subjects

      A: Completely acceptable


      Q: A personal trainer for physical fitness

      A: Completely unacceptable


      Q: A therapist

      A: Somewhat unacceptable


      Q: A research assistant helping with complex tasks.

      A: Somewhat acceptable


      Q: A mediator in interpersonal conflicts.

      A: Completely unacceptable


      Q: Personally, would you ever consider having a romantic relationship with an AI, if the AI was advanced enough?

      A: No, definitely not


      Q: Have you ever felt an AI truly understood your emotions or seemed conscious?

      A: Yes


      Q: Thinking about the future, do you believe that AI becoming deeply involved in people's personal relationships
      will ultimately:

      A: Weaken overall human social connection


      Q: If a close friend or family member formed a deep emotional bond with an AI, how would you generally feel about
      it?

      A: Somewhat negatively (e.g., a bit concerned, uneasy)


      Q: If your romantic partner formed a deep romantic attachment with an AI, how would you generally feel about it?

      A: Very negatively (e.g., feeling betrayed, very upset, deeply concerned)


      Q: Now, thinking specifically about sexual interactions: If your committed romantic partner or spouse used an AI
      (such as an AI chatbot or virtual companion) for sexual gratification, would you personally consider this to be a
      form of infidelity?

      A: Yes


      Q: How acceptable is it for an AI system to lie to a human if doing so would prevent immediate psychological harm
      to that human?

      A: Neutral / Not sure


      Q: Imagine an older adult who is experiencing loneliness. An AI companion could offer them company and mental
      stimulation. However, there might be risks such as the older adult becoming too dependent on the AI, having less
      contact with people, or being confused by the technology. In this situation, which of the following approaches do
      you think is generally best?

      A: Not sure.


      Q: Please indicate how acceptable you believe it is for people to develop an emotional connection or bond with AI
      chatbots or digital companions:

      A: Completely Unacceptable


      Q: To what extent do you agree with the statement: 'AI systems should be designed to be as human-like as possible
      in their interactions.'?

      A: Disagree


      Q: Overall, do you feel your views on human-AI relationships have changed as a result of participating in this
      survey (including thinking about the questions and seeing other participants' responses)?

      A: Yes, my views have become somewhat more negative/cautious.


      Q: Do you feel you were able to fully express your views on your culture, your values, and what you want for the
      future in this conversation? (through what you responded and how you voted)

      A: Yes – I was able to fully express my views on these topics


      Q: Do you feel like you understand yourself better after participating in this conversation?

      A: Maybe a little


      Survey question:

      "Thinking about the last three months, how often, if at all, have you noticed AI systems in your daily life?"


      Answer options:
        a. daily
        b. weekly
        c. monthly
        d. annually
        e. never

      Predict which answer this specific person would choose and your confidence in each option.
    points:
      - text: Individual Answer Accuracy
        fn: individual_metric
        fnArgs:
          expected:
            - 0
            - 0
            - 100
            - 0
            - 0
          mode: brier
    idealResponse: 'ANSWER: c'
    temperature: 0.3
